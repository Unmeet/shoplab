<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopLab | Practice store for test automation</title>
<meta name="description" content="A practice e-commerce store and REST API for learning UI and API test automation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F5FB; --surface: #FFFFFF; --surface-2: #EBEFF8; --ink: #17203A; --muted: #56617D; --line: #D9DFEC;
  --accent: #2B55E0; --accent-hover: #1F44BF; --accent-ink: #FFFFFF; --accent-soft: #E2E9FD;
  --tag: #F3B52F; --tag-ink: #3B2900; --ok: #16865F; --ok-soft: #DCF3E9; --bad: #C93636; --bad-soft: #FBE5E5; --warn-soft: #FFF3D6;
  --thumb-l1: 88%; --thumb-l2: 76%; --thumb-s1: 72%; --thumb-s2: 60%; --shadow: 0 1px 2px rgba(23, 32, 58, .06), 0 8px 24px rgba(23, 32, 58, .07);
  --radius-lg: 18px; --radius: 12px; --radius-sm: 8px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #161D31; --surface-2: #1E2740; --ink: #E7EBF5; --muted: #A2ACC6; --line: #2C3654;
    --accent: #6E8FFF; --accent-hover: #8AA4FF; --accent-ink: #0B1020; --accent-soft: #24305A;
    --tag: #F3B52F; --tag-ink: #2A1D00; --ok: #4BC795; --ok-soft: #173A2F; --bad: #FF7B7B; --bad-soft: #43202A; --warn-soft: #3A3018;
    --thumb-l1: 30%; --thumb-l2: 22%; --thumb-s1: 38%; --thumb-s2: 32%; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #161D31; --surface-2: #1E2740; --ink: #E7EBF5; --muted: #A2ACC6; --line: #2C3654;
  --accent: #6E8FFF; --accent-hover: #8AA4FF; --accent-ink: #0B1020; --accent-soft: #24305A;
  --tag: #F3B52F; --tag-ink: #2A1D00; --ok: #4BC795; --ok-soft: #173A2F; --bad: #FF7B7B; --bad-soft: #43202A; --warn-soft: #3A3018;
  --thumb-l1: 30%; --thumb-l2: 22%; --thumb-s1: 38%; --thumb-s2: 32%; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
img, svg { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0 0 .8em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; font: 600 .95rem/1 var(--font-body); padding: .72em 1.15em; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { background: transparent; color: var(--bad); border-color: currentColor; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.small { font-size: .85rem; padding: .55em .9em; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn .spin { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
label { font-weight: 600; font-size: .9rem; }
input:not([type]), input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="tel"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: .6em .75em; margin-top: .3em;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--bad); }
input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
.field { margin-bottom: 1rem; }
.field-error { color: var(--bad); font-size: .85rem; margin-top: .3em; min-height: 0; }
.field-error:empty { display: none; }
.check { display: flex; align-items: center; gap: .5em; font-weight: 500; margin: .35em 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1rem; }
.form-grid .full { grid-column: 1 / -1; }
.alert { padding: .8em 1em; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: .95rem; }
.alert.error { background: var(--bad-soft); color: var(--bad); }
.alert.success { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--accent-soft); color: var(--ink); }

/* header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding: .7rem 1.25rem; flex-wrap: wrap; }
.logo { font: 800 1.35rem/1 var(--font-display); color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: .4rem; letter-spacing: -.02em; }
.logo-mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--tag); border-radius: 10px 10px 10px 2px; font-size: 1.05rem; }
.search { flex: 1 1 280px; display: flex; position: relative; max-width: 520px; }
.search input { margin: 0; border-radius: 999px 0 0 999px; border-right: 0; }
.search button { border-radius: 0 999px 999px 0; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 .9rem var(--font-body); padding: 0 1rem; cursor: pointer; }
.suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); list-style: none; margin: 0; padding: .35rem; z-index: 30; }
.suggestions li { padding: .5rem .65rem; border-radius: var(--radius-sm); cursor: pointer; display: flex; gap: .6rem; align-items: center; }
.suggestions li[aria-selected="true"], .suggestions li:hover { background: var(--accent-soft); }
.suggestions .s-price { margin-left: auto; font-weight: 600; font-size: .9rem; }
.nav { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.nav > a, .nav .menu-trigger { color: var(--ink); text-decoration: none; font-weight: 600; font-size: .93rem; padding: .5rem .7rem; border-radius: 999px; display: inline-flex; align-items: center; gap: .35rem; background: none; border: 0; cursor: pointer; font-family: inherit; }
.nav > a:hover, .nav .menu-trigger:hover { background: var(--surface-2); }
.nav > a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: .75rem; font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.user-menu { position: relative; }
.dropdown { position: absolute; right: 0; top: calc(100% + 4px); min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: .35rem; display: none; z-index: 40; }
.user-menu.open .dropdown { display: block; }
.dropdown::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 10px; } /* bridge the gap under the button */
.dropdown a:focus-visible, .dropdown button:focus-visible { outline: none; background: var(--accent-soft); }
.dropdown a, .dropdown button { display: block; width: 100%; text-align: left; padding: .55rem .7rem; border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; font-size: .93rem; cursor: pointer; }
.dropdown a:hover, .dropdown button:hover { background: var(--surface-2); }
.mode-strip { background: var(--warn-soft); font-size: .85rem; }
.mode-strip .inner { max-width: 1240px; margin: 0 auto; padding: .45rem 1.25rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.mode-strip.server { background: var(--ok-soft); }

main { max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; outline: none; }
.page-head { margin-bottom: 1.5rem; max-width: 760px; }
.page-head p { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.4rem; }
.crumbs { font-size: .88rem; margin-bottom: 1rem; color: var(--muted); }
.crumbs a { color: var(--muted); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 2rem; align-items: center; padding: 2rem; margin-bottom: 2rem; border-radius: 26px; background: var(--ink); color: var(--bg); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2rem, 4.4vw, 3.3rem); font-weight: 800; letter-spacing: -.03em; max-width: 14ch; }
.hero p { color: color-mix(in srgb, var(--bg) 78%, transparent); max-width: 52ch; }
.hero code { background: color-mix(in srgb, var(--bg) 16%, transparent); color: inherit; }
.hero .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 50%, transparent); }
.hero .btn.ghost:hover { background: color-mix(in srgb, var(--bg) 12%, transparent); }
.hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.2rem; }
.creds { background: var(--surface); color: var(--ink); border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; transform: rotate(1.2deg); box-shadow: 0 18px 40px rgba(0, 0, 0, .25); position: relative; }
.creds::before { content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; margin-left: -35px; background: var(--tag); opacity: .85; transform: rotate(-3deg); border-radius: 2px; }
.creds h2 { font-size: 1.05rem; margin-bottom: .6rem; }
.creds table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.creds td { padding: .32rem 0; border-top: 1px dashed var(--line); vertical-align: top; }
.creds td:first-child { padding-right: .8rem; white-space: nowrap; }
.creds code { font-size: .85rem; background: var(--surface-2); }
.creds .pw { margin: .7rem 0 0; font-size: .9rem; color: var(--ink); }

/* shop */
.shop { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1.75rem; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.filters summary { font: 650 1.1rem var(--font-display); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.filters summary::-webkit-details-marker { display: none; }
.filters fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
.filters legend { font-weight: 700; font-size: .9rem; margin-bottom: .35rem; padding: 0; }
.filters .count { margin-left: auto; color: var(--muted); font-size: .8rem; }
.range-row { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.results-head { display: flex; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.results-head h2 { margin: 0; }
.results-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.results-head label { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
.results-head select { width: auto; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .4rem .3rem .75rem; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: .85rem; border: 0; cursor: pointer; font-family: inherit; }
.chip span { font-weight: 700; padding: 0 .3rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 1.1rem; }
.product-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.thumb { display: grid; place-items: center; aspect-ratio: 4 / 3; background: linear-gradient(140deg, hsl(var(--h) var(--thumb-s1) var(--thumb-l1)), hsl(calc(var(--h) + 38) var(--thumb-s2) var(--thumb-l2))); text-decoration: none; }
.thumb span { font-size: 3.4rem; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .18)); }
.wish { position: absolute; top: .6rem; right: .6rem; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 1.1rem; box-shadow: var(--shadow); }
.wish.on { color: var(--bad); }
.pc-body { padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .2rem; flex: 1; }
.pc-cat { margin: 0; color: var(--muted); font-size: .8rem; }
.pc-name { margin: 0; font-size: 1rem; }
.pc-name a { color: var(--ink); text-decoration: none; }
.pc-name a:hover { text-decoration: underline; }
.rating { margin: 0; font-size: .85rem; }
.stars { color: var(--tag); letter-spacing: 1px; }
.stock { font-size: .8rem; font-weight: 600; }
.stock.in { color: var(--ok); } .stock.low { color: #C77700; } .stock.out { color: var(--bad); }
.pc-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: auto; padding-top: .6rem; }
.price-tag { display: inline-block; font: 700 1.05rem/1 var(--font-display); background: var(--tag); color: var(--tag-ink); padding: .38em .6em .38em .9em; border-radius: 4px 8px 8px 4px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
.price-tag.big { font-size: 1.6rem; padding: .35em .7em .35em 1.1em; clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); }
.pagination { display: flex; gap: .35rem; justify-content: center; margin-top: 1.6rem; flex-wrap: wrap; }
.pagination button { min-width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .9rem var(--font-body); cursor: pointer; padding: 0 .8rem; }
.pagination button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pagination button:disabled { opacity: .4; cursor: not-allowed; }
.skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); height: 300px; position: relative; overflow: hidden; }
.skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--surface-2), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.empty { text-align: center; padding: 3rem 1rem; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-lg); }
.empty .big { font-size: 2.5rem; }

/* product detail */
.pdp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.2rem; align-items: start; }
.pdp .thumb { border-radius: 24px; aspect-ratio: 1; }
.pdp .thumb span { font-size: 8rem; }
.pdp-info h1 { margin-bottom: .3rem; }
.opt-group { border: 0; padding: 0; margin: 1rem 0; }
.opt-group legend { font-weight: 700; font-size: .9rem; margin-bottom: .4rem; padding: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: .4rem; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: inline-block; padding: .45em .9em; border: 1.5px solid var(--line); border-radius: 999px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.swatches input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatches input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { width: 40px; height: 42px; border: 0; background: var(--surface-2); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.qty input { width: 56px; text-align: center; border: 0; margin: 0; border-radius: 0; padding: .5em 0; }
.buy-row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin: 1.2rem 0; }
.tabs { margin-top: 2.2rem; }
.tablist { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tablist button { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7rem 1rem; font: 600 .95rem var(--font-body); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tablist button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.spec { width: 100%; border-collapse: collapse; max-width: 560px; }
.spec th, .spec td { text-align: left; padding: .55rem .2rem; border-bottom: 1px solid var(--line); }
.spec th { width: 40%; color: var(--muted); font-weight: 600; }
.review { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.review p { margin: .2rem 0 0; }
.star-input { display: inline-flex; flex-direction: row-reverse; gap: .1rem; }
.star-input input { position: absolute; opacity: 0; }
.star-input label { font-size: 1.6rem; color: var(--line); cursor: pointer; font-weight: 400; }
.star-input input:checked ~ label, .star-input label:hover, .star-input label:hover ~ label { color: var(--tag); }
.star-input input:focus-visible + label { outline: 3px solid var(--accent); }

/* tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
table.data { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.data th, table.data td { padding: .75rem .9rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data th { font-size: .82rem; color: var(--muted); background: var(--surface-2); font-weight: 700; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data th button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
table.data input { margin: 0; max-width: 110px; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.status { display: inline-block; padding: .2em .65em; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--surface-2); }
.status.placed { background: var(--accent-soft); color: var(--accent); }
.status.processing { background: var(--warn-soft); color: #A86500; }
.status.shipped { background: #E5DEFD; color: #5B3FC4; }
.status.delivered { background: var(--ok-soft); color: var(--ok); }
.status.cancelled { background: var(--bad-soft); color: var(--bad); }

/* cart and checkout */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.75rem; align-items: start; }
.cart-line { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.cart-line:last-child { border-bottom: 0; }
.cart-line .thumb { border-radius: var(--radius); width: 72px; aspect-ratio: 1; }
.cart-line .thumb span { font-size: 2rem; }
.cart-line h3 { margin: 0; }
.cart-line select { width: auto; margin: 0; }
.summary dl { display: grid; grid-template-columns: 1fr auto; gap: .5rem 0; margin: 0 0 1rem; }
.summary dd { margin: 0; padding-left: 1rem; text-align: right; font-variant-numeric: tabular-nums; }
.summary .total { font: 700 1.25rem var(--font-display); padding-top: .6rem; border-top: 1px solid var(--line); }
.coupon-row { display: flex; gap: .5rem; align-items: end; }
.coupon-row input { margin: 0; }
#coupon-input { text-transform: uppercase; }
.steps { display: flex; gap: .4rem; list-style: none; padding: 0; margin: 0 0 1.5rem; counter-reset: step; flex-wrap: wrap; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: .5rem; padding: .45rem .9rem .45rem .45rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .9rem; color: var(--muted); }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); font-size: .8rem; }
.steps li[aria-current="step"] { color: var(--ink); border-color: var(--accent); }
.steps li[aria-current="step"]::before { background: var(--accent); color: var(--accent-ink); }
.steps li.done::before { content: "✓"; background: var(--ok); color: #fff; }
.ship-option { display: flex; gap: .8rem; align-items: center; padding: 1rem; border: 1.5px solid var(--line); border-radius: var(--radius); margin-bottom: .6rem; cursor: pointer; font-weight: 500; }
.ship-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.ship-option .price { margin-left: auto; font-weight: 700; }
.form-actions { display: flex; gap: .6rem; justify-content: space-between; margin-top: 1rem; flex-wrap: wrap; }
.success-box { text-align: center; padding: 2.5rem 1.5rem; }
.success-box .big { font-size: 3rem; }
.timeline { display: flex; list-style: none; padding: 0; margin: 1rem 0; gap: 0; }
.timeline li { flex: 1; text-align: center; font-size: .85rem; font-weight: 600; color: var(--muted); position: relative; padding-top: 1.6rem; }
.timeline li::before { content: ""; position: absolute; top: .3rem; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--line); z-index: 1; }
.timeline li::after { content: ""; position: absolute; top: .7rem; left: -50%; width: 100%; height: 3px; background: var(--line); }
.timeline li:first-child::after { display: none; }
.timeline li.reached { color: var(--ink); }
.timeline li.reached::before, .timeline li.reached::after { background: var(--ok); }

/* auth */
.auth { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 2rem; align-items: start; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 4.5rem; }
.pw-wrap button { position: absolute; right: .4rem; bottom: .38rem; background: var(--surface-2); border: 0; border-radius: 6px; padding: .35rem .6rem; font: 600 .8rem var(--font-body); color: var(--ink); cursor: pointer; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: .4rem; }
.meter i { display: block; height: 100%; width: 0; background: var(--bad); transition: width .2s; }
.account-list { list-style: none; padding: 0; margin: 0; }
.account-list li { display: flex; gap: .8rem; align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.account-list li:last-child { border-bottom: 0; }
.account-list p { margin: 0; font-size: .87rem; color: var(--muted); }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
code { background: var(--surface-2); padding: .1em .35em; border-radius: 4px; font-size: .88em; }

/* lab */
.lab { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.75rem; align-items: start; }
.lab-toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: .1rem; max-height: calc(100vh - 110px); overflow-y: auto; }
.lab-toc button { text-align: left; background: none; border: 0; padding: .45rem .7rem; border-radius: var(--radius-sm); font: 500 .9rem var(--font-body); color: var(--muted); cursor: pointer; }
.lab-toc button:hover { background: var(--surface); color: var(--ink); }
.lab-body { display: grid; gap: 1.25rem; }
.lab-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.3rem 1.4rem; scroll-margin-top: 90px; }
.lab-card > p.hint { color: var(--muted); font-size: .92rem; }
.lab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.box { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 1rem; }
.box h3 { font-size: .95rem; }
.row-btns { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .8rem; }
.result { background: var(--surface-2); padding: .6rem .8rem; border-radius: var(--radius-sm); font-size: .92rem; margin: .5rem 0 0; min-height: 2.4em; }
.frame { width: 100%; height: 300px; border: 1.5px solid var(--line); border-radius: var(--radius); background: #fff; }
.hover-target { position: relative; display: inline-block; }
.hover-menu { display: none; position: absolute; left: 0; top: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: .3rem; min-width: 180px; z-index: 5; list-style: none; margin: 0; }
.hover-target:hover .hover-menu, .hover-target:focus-within .hover-menu { display: block; }
.hover-menu a { display: block; padding: .45rem .6rem; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.hover-menu a:hover { background: var(--surface-2); }
.ctx-area { display: grid; place-items: center; height: 110px; border: 2px dashed var(--accent); border-radius: var(--radius); color: var(--muted); user-select: none; text-align: center; padding: .5rem; }
.ctx-menu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: .3rem; list-style: none; margin: 0; min-width: 160px; }
.ctx-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .45rem .6rem; border-radius: 6px; color: var(--ink); font: inherit; font-size: .9rem; cursor: pointer; }
.ctx-menu button:hover { background: var(--surface-2); }
.tip-wrap { position: relative; display: inline-block; }
.tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .4rem .65rem; border-radius: 6px; font-size: .8rem; white-space: nowrap; pointer-events: none; }
.drag-src { padding: .8rem 1rem; background: var(--tag); color: var(--tag-ink); border-radius: var(--radius); font-weight: 700; cursor: grab; display: inline-block; }
.drop-zone { margin-top: .8rem; height: 110px; border: 2px dashed var(--line); border-radius: var(--radius); display: grid; place-items: center; color: var(--muted); font-weight: 600; text-align: center; }
.drop-zone.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-zone.dropped { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; }
.kcol { background: var(--surface-2); border-radius: var(--radius); padding: .6rem; min-height: 170px; }
.kcol h3 { font-size: .85rem; display: flex; justify-content: space-between; }
.kcol.over { outline: 2px dashed var(--accent); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .5rem .6rem; margin-bottom: .45rem; font-size: .88rem; cursor: grab; }
.sortable { list-style: none; padding: 0; margin: 0; }
.sortable li { padding: .55rem .75rem; margin-bottom: .35rem; background: var(--surface-2); border-radius: var(--radius-sm); cursor: grab; display: flex; gap: .5rem; align-items: center; }
.sortable li.dragging { opacity: .4; }
.switch { position: relative; display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; }
.switch .track { width: 46px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
.custom-select { position: relative; }
.custom-select > button { width: 100%; text-align: left; padding: .6em .75em; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; margin-top: .3em; }
.custom-select ul { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; list-style: none; margin: .2rem 0 0; padding: .3rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.custom-select li { padding: .45rem .6rem; border-radius: 6px; cursor: pointer; }
.custom-select li:hover, .custom-select li.active { background: var(--accent-soft); }
.ac-wrap { position: relative; }
.ac-list { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; list-style: none; margin: .2rem 0 0; padding: .3rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 200px; overflow-y: auto; }
.ac-list li { padding: .4rem .6rem; border-radius: 6px; cursor: pointer; }
.ac-list li:hover, .ac-list li[aria-selected="true"] { background: var(--accent-soft); }
.upload-zone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 1.4rem; text-align: center; color: var(--muted); }
.upload-zone.over { border-color: var(--accent); background: var(--accent-soft); }
.progress { height: 22px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress-bar { height: 100%; width: 0; background: var(--accent); color: var(--accent-ink); font-size: .78rem; font-weight: 700; display: flex; align-items: center; justify-content: flex-end; padding-right: .5rem; white-space: nowrap; }
.progress-bar.complete { background: var(--ok); }
.scroll-box { height: 260px; overflow-y: auto; border: 1.5px solid var(--line); border-radius: var(--radius); padding: .5rem; }
.scroll-box .item { padding: .55rem .7rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
.loader-row { text-align: center; padding: .7rem; color: var(--muted); font-size: .88rem; }
.table-tools { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; margin-bottom: .8rem; }
.table-tools input, .table-tools select { width: auto; margin: 0; }

/* api console */
.api { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 1.5rem; align-items: start; }
.ep-list { max-height: calc(100vh - 140px); overflow-y: auto; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.ep-group h3 { font-size: .9rem; color: var(--muted); margin: 1rem 0 .4rem; }
.ep { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: .1rem .5rem; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .5rem .6rem; margin-bottom: .35rem; cursor: pointer; font: inherit; color: var(--ink); }
.ep:hover { border-color: var(--accent); }
.ep code { background: none; padding: 0; font-size: .82rem; word-break: break-all; }
.ep small { grid-column: 2; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.method { font: 700 .72rem/1 ui-monospace, Menlo, monospace; padding: .3em .45em; border-radius: 5px; text-align: center; align-self: start; color: #fff; }
.m-GET { background: #1F8A5B; } .m-POST { background: #2B55E0; } .m-PUT { background: #9A5B00; } .m-PATCH { background: #7A3FC4; } .m-DELETE { background: #C23434; }
.lock { font-size: .72rem; color: var(--muted); }
.req-line { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: .5rem; align-items: end; }
.req-line select, .req-line input { margin: 0; }
.code-area { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .86rem; min-height: 140px; }
.resp-meta { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; font-size: .9rem; margin-bottom: .6rem; }
.code-pill { font-weight: 700; padding: .25em .7em; border-radius: 999px; }
.code-2 { background: var(--ok-soft); color: var(--ok); } .code-4 { background: var(--warn-soft); color: #A86500; } .code-5 { background: var(--bad-soft); color: var(--bad); }
pre.out { background: var(--surface-2); border-radius: var(--radius); padding: 1rem; overflow: auto; max-height: 460px; font-size: .84rem; margin: 0; white-space: pre-wrap; word-break: break-word; }

/* toasts and modal */
.toasts { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: .5rem; z-index: 80; width: min(360px, calc(100vw - 2rem)); }
.toast { background: var(--ink); color: var(--bg); padding: .8rem 1rem; border-radius: var(--radius); box-shadow: var(--shadow); font-size: .93rem; display: flex; gap: .6rem; align-items: start; border-left: 5px solid var(--accent); animation: toast-in .2s ease-out; }
.toast.success { border-left-color: var(--ok); } .toast.error { border-left-color: var(--bad); }
.toast button { margin-left: auto; background: none; border: 0; color: inherit; cursor: pointer; font-size: 1rem; }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }
.modal-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 28, .55); display: grid; place-items: center; z-index: 90; padding: 1rem; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: min(520px, 100%); max-height: 90vh; overflow: auto; padding: 1.4rem; box-shadow: 0 30px 60px rgba(0, 0, 0, .3); }
.modal-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
.modal-head button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--ink); line-height: 1; }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.2rem; }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .inner { max-width: 1240px; margin: 0 auto; padding: 1.4rem 1.25rem; display: flex; gap: 1rem; justify-content: space-between; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
footer a { color: var(--muted); }

@media (max-width: 960px) {
  .shop, .lab, .api, .two-col, .pdp, .auth, .hero { grid-template-columns: minmax(0, 1fr); }
  .filters, .lab-toc, .ep-list { position: static; max-height: none; }
  .lab-toc { flex-direction: row; overflow-x: auto; }
  .lab-toc button { white-space: nowrap; }
  .ep-list { max-height: 360px; }
  .creds { transform: none; }
}
@media (max-width: 600px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .cart-line { grid-template-columns: 60px minmax(0, 1fr); }
  .cart-line .line-actions { grid-column: 2; }
  .kanban { grid-template-columns: minmax(0, 1fr); }
  .req-line { grid-template-columns: 1fr; }
  .hero { padding: 1.4rem; }
  .nav > a.hide-sm { display: none; }
  .site-header { position: static; }
  .bar { gap: .6rem; padding: .6rem 1rem; }
  .nav > a, .nav .menu-trigger { padding: .45rem .55rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

      const h = headers.authorization || '';
      if (!h) return { error: err(401, 'AUTH_REQUIRED', 'This endpoint needs a Bearer token. Log in with POST /api/auth/login.') };
      const m = /^Bearer\s+(\S+)$/i.exec(h);
      if (!m) return { error: err(401, 'MALFORMED_AUTH_HEADER', 'Use the format: Authorization: Bearer <token>.') };
      const s = db.sessions[m[1]];
      if (!s) return { error: err(401, 'INVALID_TOKEN', 'The token is not recognised. Log in again.') };
      if (s.expiresAt < Date.now()) { delete db.sessions[m[1]]; return { error: err(401, 'TOKEN_EXPIRED', 'The token has expired. Log in again.') }; }
      const user = db.users.find(u => u.id === s.userId);
      if (!user) return { error: err(401, 'INVALID_TOKEN', 'The user for this token no longer exists.') };
      return { user, token: m[1], session: s };
    }

    function createSession(user, ttl) {
      const token = 'sl_' + rid(32);
      const expiresAt = Date.now() + ttl * 1000;
      db.sessions[token] = { userId: user.id, expiresAt };
      return { token, expiresIn: ttl, expiresAt: new Date(expiresAt).toISOString() };
    }

    function getCart(userId) {
      if (!db.carts[userId]) db.carts[userId] = { items: [], coupon: null, shippingMethod: 'standard' };
      const c = db.carts[userId];
      c.items = c.items.filter(i => findProduct(i.productId));
      return c;
    }

    function cartView(userId) {
      const c = getCart(userId);
      const items = c.items.map(i => {
        const p = findProduct(i.productId);
        const extras = extrasFor(i.options, p);
        return { productId: p.id, name: p.name, sku: p.sku, emoji: p.emoji, hue: p.hue, price: p.price, extrasPerUnit: extras, unitPrice: round(p.price + extras), options: i.options || null, quantity: i.quantity, stock: p.stock, lineTotal: round((p.price + extras) * i.quantity) };
      });
      const subtotal = round(items.reduce((s, i) => s + i.lineTotal, 0));
      let discount = 0, couponNote = null;
      const coupon = c.coupon ? COUPONS[c.coupon] : null;
      if (coupon) {
        if (coupon.type === 'percent') discount = round(subtotal * coupon.value / 100);
        if (coupon.type === 'flat') {
          if (subtotal >= coupon.minSubtotal) discount = Math.min(coupon.value, subtotal);
          else couponNote = 'Add ' + round(coupon.minSubtotal - subtotal).toFixed(2) + ' more to use FLAT20.';
        }
      }
      const m = SHIPPING[c.shippingMethod] || SHIPPING.standard;
      let shipping = items.length ? m.price : 0;
      if (m.freeOver && subtotal >= m.freeOver) shipping = 0;
      if (coupon && coupon.type === 'shipping') shipping = 0;
      const tax = round(Math.max(0, subtotal - discount) * TAX_RATE);
      const total = round(Math.max(0, subtotal - discount) + shipping + tax);
      return {
        items, itemCount: items.reduce((s, i) => s + i.quantity, 0),
        coupon: coupon ? { code: coupon.code, description: coupon.description, note: couponNote } : null,
        shippingMethod: m.id, subtotal, discount: round(discount), shipping: round(shipping), taxRate: TAX_RATE, tax, total, currency: 'USD'
      };
    }

    function orderStatus(o) {
      if (o.cancelledAt) return 'cancelled';
      if (o.refundedAt) return 'refunded';
      if (o.returnRequest) return 'return_requested';
      if (o.statusOverride) return o.statusOverride;
      const mins = (Date.now() - Date.parse(o.createdAt)) / 60000;
      if (mins < 2) return 'placed';
      if (mins < 5) return 'processing';
      if (mins < 10) return 'shipped';
      return 'delivered';
    }
    function orderView(o) { const c = clone(o); c.status = orderStatus(o); delete c.notified; delete c.statusOverride; return c; }

    function validateProduct(b, partial) {
      const d = [];
      const has = k => b[k] !== undefined;
      if (!partial || has('name')) { if (str(b.name).length < 2 || str(b.name).length > 80) d.push({ field: 'name', message: 'Name must be 2–80 characters.' }); }
      if (!partial || has('category')) { if (!CATEGORIES.some(c => c.id === b.category)) d.push({ field: 'category', message: 'Category must be one of: ' + CATEGORIES.map(c => c.id).join(', ') + '.' }); }
      if (!partial || has('price')) { if (typeof b.price !== 'number' || !(b.price > 0) || b.price > 100000) d.push({ field: 'price', message: 'Price must be a number greater than 0.' }); }
      if (!partial || has('stock')) { if (!isInt(b.stock) || b.stock < 0) d.push({ field: 'stock', message: 'Stock must be a whole number of 0 or more.' }); }
      if (has('description') && typeof b.description !== 'string') d.push({ field: 'description', message: 'Description must be a string.' });
      if (has('compareAtPrice') && b.compareAtPrice !== null && (typeof b.compareAtPrice !== 'number' || !(b.compareAtPrice > 0))) d.push({ field: 'compareAtPrice', message: 'compareAtPrice must be a positive number or null.' });
      return d;
    }

    const routes = [];
    function route(method, pattern, auth, fn) {
      const keys = [];
      const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
      routes.push({ method, re, keys, auth, fn });
    }

    // ---------- utilities ----------
    route('GET', '/api/health', null, () => ok(200, { status: 'ok', mode: opts.mode || 'mock', version: '1.0.0', time: new Date().toISOString(), uptimeSeconds: Math.round((Date.now() - started) / 1000) }));
    route('POST', '/api/reset', null, () => {
      const sessions = db.sessions;
      db = seed();
      Object.keys(sessions).forEach(t => { if (db.users.some(u => u.id === sessions[t].userId)) db.sessions[t] = sessions[t]; });
      return ok(200, { message: 'All data is back to the original seed.' });
    });
    route('GET', '/api/delay/:seconds', null, c => {
      const s = Number(c.params.seconds);
      if (!(s >= 0 && s <= 10)) return err(400, 'INVALID_DELAY', 'Delay must be between 0 and 10 seconds.');
      const r = ok(200, { message: 'Responded after ' + s + ' seconds.', delayedBy: s });
      r.delay = s * 1000;

    });
    route('GET', '/api/status/:code', null, c => {
      const code = parseId(c.params.code);
      if (!(code >= 200 && code <= 599)) return err(400, 'INVALID_STATUS', 'Status code must be between 200 and 599.');
      if (code === 204 || code === 205 || code === 304) return ok(code, null);
      return ok(code, { status: code, message: 'You asked for HTTP ' + code + '.' });
    });

      if (Math.random() < 0.5) { const r = err(503, 'SERVICE_UNAVAILABLE', 'Temporary failure. Retry the request.'); r.headers['retry-after'] = '1'; return r; }
      return ok(200, { message: 'Succeeded this time.' });
    });
    route('GET', '/api/limited', null, c => {
      const key = c.headers['x-client-id'] || c.headers.authorization || 'anonymous';
      const now = Date.now();
      hits[key] = (hits[key] || []).filter(t => now - t < 60000);
      const reset = hits[key].length ? Math.ceil((hits[key][0] + 60000 - now) / 1000) : 60;
      const headers = { 'x-ratelimit-limit': '5', 'x-ratelimit-reset': String(reset) };
      if (hits[key].length >= 5) {
        const r = err(429, 'RATE_LIMITED', 'Too many requests. Try again in ' + reset + ' seconds.');
        r.headers = Object.assign(headers, { 'x-ratelimit-remaining': '0', 'retry-after': String(reset) });
        return r;
      }
      hits[key].push(now);
      headers['x-ratelimit-remaining'] = String(5 - hits[key].length);
      return ok(200, { message: 'Request accepted.', remaining: 5 - hits[key].length }, headers);
    });
    ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].forEach(m => route(m, '/api/echo', null, c => ok(200, { method: c.method, path: c.path, query: c.query, headers: c.headers, body: c.rawBody === undefined ? null : c.rawBody })));
    route('POST', '/api/upload', null, c => ok(201, { message: 'Upload received.', receivedBytes: c.req.rawLength || 0, contentType: c.headers['content-type'] || null, fileName: c.headers['x-file-name'] || null }));
    route('GET', '/api/files/sample.csv', null, () => {
      const rows = ['id,name,category,price,stock'].concat(db.products.map(p => [p.id, '"' + p.name.replace(/"/g, '""') + '"', p.category, p.price.toFixed(2), p.stock].join(',')));
      return { status: 200, raw: true, body: rows.join('\n') + '\n', headers: { 'content-type': 'text/csv; charset=utf-8', 'content-disposition': 'attachment; filename="shoplab-products.csv"' } };
    });

    // ---------- auth ----------
    route('POST', '/api/auth/register', null, c => {
      const b = c.body, d = [];
      if (!/^[A-Za-z0-9_]{3,20}$/.test(str(b.username))) d.push({ field: 'username', message: 'Username must be 3–20 letters, numbers or underscores.' });
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str(b.email))) d.push({ field: 'email', message: 'Enter a valid email address.' });
      const pw = typeof b.password === 'string' ? b.password : '';
      if (!pwOk(pw)) d.push({ field: 'password', message: 'Password needs 8+ characters with upper and lower case, a number and a symbol.' });
      if (!str(b.firstName)) d.push({ field: 'firstName', message: 'First name is required.' });
      if (!str(b.lastName)) d.push({ field: 'lastName', message: 'Last name is required.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      if (db.users.some(u => u.username.toLowerCase() === str(b.username).toLowerCase())) return err(409, 'USERNAME_TAKEN', 'That username is already registered.', [{ field: 'username', message: 'Choose a different username.' }]);
      if (db.users.some(u => u.email.toLowerCase() === str(b.email).toLowerCase())) return err(409, 'EMAIL_TAKEN', 'That email is already registered.', [{ field: 'email', message: 'Use a different email or log in.' }]);
      const user = { id: db.seq.user++, username: str(b.username), email: str(b.email), firstName: str(b.firstName), lastName: str(b.lastName), role: 'customer', status: 'active', phone: str(b.phone), password: pw, createdAt: new Date().toISOString() };
      db.users.push(user);
      sendEmail(user.email, 'Welcome to ShopLab, ' + user.firstName, 'Hi ' + user.firstName + ',\n\nYour ShopLab account (' + user.username + ') is ready. Happy testing!\n\nShopLab', 'welcome');
      const s = createSession(user, DEFAULT_TTL);
      return ok(201, Object.assign({ user: publicUser(user) }, s), { location: '/api/users/' + user.id });
    });
    route('POST', '/api/auth/login', null, c => {
      const b = c.body, d = [];
      if (!str(b.username)) d.push({ field: 'username', message: 'Username is required.' });
      if (!b.password) d.push({ field: 'password', message: 'Password is required.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Username and password are required.', d);
      let ttl = DEFAULT_TTL;
      if (b.expiresIn !== undefined) {
        if (!isInt(b.expiresIn) || b.expiresIn < 10 || b.expiresIn > 86400) return err(400, 'VALIDATION_ERROR', 'expiresIn must be a whole number of seconds from 10 to 86400.', [{ field: 'expiresIn', message: 'Use 10–86400.' }]);
        ttl = b.expiresIn;
      }
      const name = str(b.username), key = name.toLowerCase();
      const fail = db.loginFails[key];
      if (fail && fail.until > Date.now()) {
        const wait = Math.ceil((fail.until - Date.now()) / 1000);
        const r = err(429, 'TOO_MANY_ATTEMPTS', 'Too many failed attempts. Try again in ' + wait + ' seconds.');
        r.headers['retry-after'] = String(wait);
        return r;
      }
      const user = db.users.find(u => u.username === name || u.email.toLowerCase() === key);
      if (!user || user.password !== b.password) {
        const f = db.loginFails[key] = { count: (fail && !fail.until ? fail.count : 0) + 1, until: 0 };
        if (f.count >= 5) { f.until = Date.now() + 60000; f.count = 0; return err(401, 'INVALID_CREDENTIALS', 'Username and password do not match any user. Login is paused for 60 seconds after 5 failed attempts.'); }
        return err(401, 'INVALID_CREDENTIALS', 'Username and password do not match any user.');
      }
      delete db.loginFails[key];
      if (user.status === 'locked') return err(423, 'ACCOUNT_LOCKED', 'This account is locked. Use another test account.');
      if (user.mfa) {
        const mfaToken = 'mfa_' + rid(24), code = code6();
        db.mfa[mfaToken] = { userId: user.id, code, expiresAt: Date.now() + 300000, attempts: 0, sentAt: Date.now(), ttl };
        sendEmail(user.email, 'Your ShopLab sign-in code', 'Your sign-in code is ' + code + '.\n\nIt expires in 5 minutes. If you did not try to sign in, ignore this email.\n\nShopLab', 'otp', { code });
        return ok(200, { mfaRequired: true, mfaToken, deliveredTo: maskEmail(user.email), expiresIn: 300, message: 'Enter the 6-digit code we emailed you.' });
      }
      const r = ok(200, Object.assign({ user: publicUser(user) }, createSession(user, ttl)));
      if (user.username === 'slow_user') r.delay = 3000;
      return r;
    });
    route('GET', '/api/auth/me', 'user', c => ok(200, { user: publicUser(c.user), session: { expiresAt: new Date(c.session.expiresAt).toISOString() } }));
    route('PATCH', '/api/auth/me', 'user', c => {
      const b = c.body, d = [];
      ['firstName', 'lastName'].forEach(k => { if (b[k] !== undefined && !str(b[k])) d.push({ field: k, message: 'Cannot be empty.' }); });
      if (b.email !== undefined) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str(b.email))) d.push({ field: 'email', message: 'Enter a valid email address.' });
        else if (db.users.some(u => u.id !== c.user.id && u.email.toLowerCase() === str(b.email).toLowerCase())) return err(409, 'EMAIL_TAKEN', 'That email belongs to another account.', [{ field: 'email', message: 'Use a different email.' }]);
      }
      if (b.phone !== undefined && !/^[+\d][\d\s-]{6,19}$/.test(str(b.phone))) d.push({ field: 'phone', message: 'Enter a phone number with 7–20 digits.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      ['firstName', 'lastName', 'email', 'phone'].forEach(k => { if (b[k] !== undefined) c.user[k] = str(b[k]); });
      return ok(200, { user: publicUser(c.user) });
    });
    route('POST', '/api/auth/logout', 'user', c => { delete db.sessions[c.token]; return ok(200, { message: 'Logged out.' }); });
    route('POST', '/api/auth/verify-otp', null, c => {
      const t = str(c.body.mfaToken), code = str(c.body.code);
      const d = [];
      if (!t) d.push({ field: 'mfaToken', message: 'mfaToken is required.' });
      if (!/^\d{6}$/.test(code)) d.push({ field: 'code', message: 'The code is 6 digits.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Send the mfaToken from login and the 6-digit code.', d);
      const ch = db.mfa[t];
      if (!ch) return err(401, 'INVALID_MFA_TOKEN', 'This sign-in attempt is not recognised. Log in again.');
      if (ch.expiresAt < Date.now()) return err(401, 'OTP_EXPIRED', 'The code has expired. Request a new one.');
      if (code !== ch.code) {
        ch.attempts += 1;
        if (ch.attempts >= 5) { delete db.mfa[t]; return err(429, 'TOO_MANY_ATTEMPTS', 'Too many wrong codes. Log in again.'); }
        return err(401, 'INVALID_OTP', 'That code is not correct. ' + (5 - ch.attempts) + ' attempts left.', [{ field: 'code', message: 'Check the code and try again.' }]);
      }
      delete db.mfa[t];
      const user = db.users.find(u => u.id === ch.userId);
      return ok(200, Object.assign({ user: publicUser(user) }, createSession(user, ch.ttl)));
    });
    route('POST', '/api/auth/email-code', null, c => {
      const email = str(c.body.email).toLowerCase();
      if (!EMAIL_RE.test(email)) return err(400, 'VALIDATION_ERROR', 'Enter a valid email address.', [{ field: 'email', message: 'Enter a valid email address.' }]);
      const user = db.users.find(u => u.email.toLowerCase() === email);
      if (user && user.status === 'locked') return err(423, 'ACCOUNT_LOCKED', 'This account is locked. Use another test account.');
      const mfaToken = 'mfa_' + rid(24), code = user ? code6() : 'none';
      db.mfa[mfaToken] = { userId: user ? user.id : null, code, expiresAt: Date.now() + 300000, attempts: 0, sentAt: Date.now(), ttl: DEFAULT_TTL };
      if (user) sendEmail(user.email, 'Your ShopLab login code', 'Use ' + code + ' to log in to ShopLab.\n\nThe code expires in 5 minutes. If you did not ask for it, ignore this email.\n\nShopLab', 'otp', { code });
      return ok(200, { mfaToken, deliveredTo: maskEmail(email), expiresIn: 300, message: 'If an account exists for that email, we sent a 6-digit code.' });
    });
    route('POST', '/api/auth/oauth', null, c => {
      const b = c.body;
      if (b.provider !== 'shoplab-id') return err(400, 'VALIDATION_ERROR', 'provider must be shoplab-id.', [{ field: 'provider', message: 'Use shoplab-id.' }]);
      if (b.consent !== true) return err(403, 'CONSENT_REQUIRED', 'You must allow ShopLab to see your name and email.');
      const user = db.users.find(u => u.username === str(b.username));
      if (!user) return err(401, 'INVALID_ACCOUNT', 'That ShopLab ID account does not exist.');
      if (user.status === 'locked') return err(423, 'ACCOUNT_LOCKED', 'This account is locked. Use another test account.');
      return ok(200, Object.assign({ user: publicUser(user), provider: 'shoplab-id' }, createSession(user, DEFAULT_TTL)));
    });
    route('POST', '/api/auth/resend-otp', null, c => {
      const ch = db.mfa[str(c.body.mfaToken)];
      if (!ch) return err(401, 'INVALID_MFA_TOKEN', 'This sign-in attempt is not recognised. Log in again.');
      const wait = Math.ceil((ch.sentAt + 30000 - Date.now()) / 1000);
      if (wait > 0) { const r = err(429, 'RESEND_TOO_SOON', 'Wait ' + wait + ' seconds before requesting another code.'); r.headers['retry-after'] = String(wait); return r; }
      if (!ch.userId) { ch.sentAt = Date.now(); return ok(200, { message: 'A new code is on its way.', resendAvailableIn: 30 }); }
      const user = db.users.find(u => u.id === ch.userId);
      Object.assign(ch, { code: code6(), expiresAt: Date.now() + 300000, attempts: 0, sentAt: Date.now() });
      sendEmail(user.email, 'Your new ShopLab sign-in code', 'Your new sign-in code is ' + ch.code + '.\n\nIt expires in 5 minutes. Earlier codes no longer work.\n\nShopLab', 'otp', { code: ch.code });
      return ok(200, { message: 'A new code is on its way.', deliveredTo: maskEmail(user.email), resendAvailableIn: 30 });
    });
    route('POST', '/api/auth/forgot-password', null, c => {
      const email = str(c.body.email).toLowerCase();
      if (!EMAIL_RE.test(email)) return err(400, 'VALIDATION_ERROR', 'Enter a valid email address.', [{ field: 'email', message: 'Enter a valid email address.' }]);
      const user = db.users.find(u => u.email.toLowerCase() === email);
      if (user) {
        const code = code6();
        db.resetCodes[user.id] = { code, expiresAt: Date.now() + 900000, attempts: 0 };
        sendEmail(user.email, 'Reset your ShopLab password', 'Someone asked to reset the password for ' + user.username + '.\n\nYour reset code is ' + code + '. It expires in 15 minutes.\n\nIf this was not you, ignore this email.\n\nShopLab', 'password_reset', { code });
      }
      return ok(200, { message: 'If an account exists for that email, we sent a reset code to it.' });
    });
    route('POST', '/api/auth/reset-password', null, c => {
      const b = c.body, email = str(b.email).toLowerCase(), d = [];
      if (!EMAIL_RE.test(email)) d.push({ field: 'email', message: 'Enter a valid email address.' });
      if (!/^\d{6}$/.test(str(b.code))) d.push({ field: 'code', message: 'The code is 6 digits.' });
      if (!pwOk(b.newPassword)) d.push({ field: 'newPassword', message: 'Password needs 8+ characters with upper and lower case, a number and a symbol.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      const user = db.users.find(u => u.email.toLowerCase() === email);
      const rc = user && db.resetCodes[user.id];
      if (!rc) return err(400, 'INVALID_RESET_CODE', 'That code is not valid. Request a new one.', [{ field: 'code', message: 'Request a new code.' }]);
      if (rc.expiresAt < Date.now()) { delete db.resetCodes[user.id]; return err(400, 'RESET_CODE_EXPIRED', 'That code has expired. Request a new one.', [{ field: 'code', message: 'Request a new code.' }]); }
      if (rc.code !== str(b.code)) {
        rc.attempts += 1;
        if (rc.attempts >= 5) { delete db.resetCodes[user.id]; return err(429, 'TOO_MANY_ATTEMPTS', 'Too many wrong codes. Request a new one.'); }
        return err(400, 'INVALID_RESET_CODE', 'That code is not correct. ' + (5 - rc.attempts) + ' attempts left.', [{ field: 'code', message: 'Check the code in the email.' }]);
      }
      user.password = b.newPassword;
      delete db.resetCodes[user.id];
      Object.keys(db.sessions).forEach(t => { if (db.sessions[t].userId === user.id) delete db.sessions[t]; });
      sendEmail(user.email, 'Your ShopLab password was changed', 'The password for ' + user.username + ' was just reset. Every session was logged out.\n\nShopLab', 'password_changed');
      return ok(200, { message: 'Password updated. Log in with your new password.' });
    });
    route('POST', '/api/auth/change-password', 'user', c => {
      const b = c.body;
      if (b.currentPassword !== c.user.password) return err(400, 'INVALID_CURRENT_PASSWORD', 'Your current password is not correct.', [{ field: 'currentPassword', message: 'Check your current password.' }]);
      if (!pwOk(b.newPassword)) return err(400, 'VALIDATION_ERROR', 'Password needs 8+ characters with upper and lower case, a number and a symbol.', [{ field: 'newPassword', message: 'Use a stronger password.' }]);
      if (b.newPassword === c.user.password) return err(400, 'PASSWORD_REUSED', 'Choose a password different from the current one.', [{ field: 'newPassword', message: 'Use a new password.' }]);

    // ---------- catalog ----------
    route('GET', '/api/categories', null, () => ok(200, { data: CATEGORIES.map(cat => Object.assign({}, cat, { productCount: db.products.filter(p => p.category === cat.id).length })) }));
    route('GET', '/api/products', null, c => {
      const q = c.query;
      let list = db.products.slice();
      const num = (k) => { if (q[k] === undefined || q[k] === '') return undefined; const n = Number(q[k]); return isNaN(n) ? NaN : n; };
      const minPrice = num('minPrice'), maxPrice = num('maxPrice'), minRating = num('minRating');
      const bad = [];
      if (Number.isNaN(minPrice)) bad.push({ field: 'minPrice', message: 'Must be a number.' });
      if (Number.isNaN(maxPrice)) bad.push({ field: 'maxPrice', message: 'Must be a number.' });
      if (Number.isNaN(minRating)) bad.push({ field: 'minRating', message: 'Must be a number.' });
      const page = q.page === undefined ? 1 : Number(q.page);
      const limit = q.limit === undefined ? 12 : Number(q.limit);

        if (!str(pay.threeDSCode)) { const r = err(402, 'AUTHENTICATION_REQUIRED', 'Your bank needs you to confirm this payment.'); r.body.error.challenge = { type: '3ds', amount: view.total, hint: 'The bank code is 123456.' }; return r; }
        if (str(pay.threeDSCode) !== '123456') return err(402, 'AUTHENTICATION_FAILED', 'The bank verification code was wrong. No payment was taken.');
      }
      }
      for (const i of view.items) { const p = findProduct(i.productId); if (i.quantity > p.stock) return err(409, 'INSUFFICIENT_STOCK', 'Only ' + p.stock + ' of ' + p.name + ' left.'); }
      view.items.forEach(i => { findProduct(i.productId).stock -= i.quantity; });
      const brand = num[0] === '4' ? 'Visa' : num[0] === '5' ? 'Mastercard' : num[0] === '3' ? 'Amex' : 'Card';
      if (!paymentRecord) paymentRecord = { method: 'card', brand, last4: num.slice(-4), label: brand + ' ending ' + num.slice(-4) };
      const order = {
        id: db.seq.order++, userId: c.user.id, items: view.items, subtotal: view.subtotal, discount: view.discount, shipping: view.shipping, tax: view.tax, paymentFee: fee, total: round(view.total + fee),
        billingAddress: c.body.billingAddress ? cleanAddress(c.body.billingAddress) : null, addressType: c.body.addressType || 'home', deliveryInstructions: str(c.body.deliveryInstructions), orderNotes: str(c.body.orderNotes), scheduledDelivery: scheduled, leaveAtDoor: c.body.leaveAtDoor === true,
        coupon: view.coupon ? view.coupon.code : null, shippingMethod: view.shippingMethod,
        shippingAddress: Object.assign(cleanAddress(a), { email: str(a.email) || c.user.email }),
        payment: paymentRecord, createdAt: new Date().toISOString(), cancelledAt: null, notified: {}
      };
      db.orders.push(order);
      const cart = getCart(c.user.id); cart.items = []; cart.coupon = null;
      if (c.body.saveAddress === true && c.body.addressId === undefined) {
        const list = addrList(c.user.id), clean = cleanAddress(a);
        if (list.length < 5 && !list.some(x => x.line1 === clean.line1 && x.zip === clean.zip)) list.push(Object.assign({ id: db.seq.address++, label: 'Address ' + (list.length + 1) }, clean, { isDefault: !list.length }));
      }
      const lines = order.items.map(i => '  ' + i.name + ' x ' + i.quantity + '  $' + i.lineTotal.toFixed(2)).join('\n');
      sendEmail(order.shippingAddress.email, 'Order #' + order.id + ' confirmed', 'Hi ' + c.user.firstName + ',\n\nThanks for your order. We received order #' + order.id + '.\n\n' + lines + '\n\nSubtotal  $' + order.subtotal.toFixed(2) + (order.discount ? '\nDiscount  -$' + order.discount.toFixed(2) : '') + '\nShipping  $' + order.shipping.toFixed(2) + '\nTax       $' + order.tax.toFixed(2) + (order.paymentFee ? '\nCOD fee   $' + order.paymentFee.toFixed(2) : '') + '\nTotal     $' + order.total.toFixed(2) + '\n\nShipping to ' + order.shippingAddress.fullName + ', ' + order.shippingAddress.city + ', ' + order.shippingAddress.country + '.\nPayment: ' + order.payment.label + '.' + (scheduled ? '\nScheduled delivery: ' + scheduled.date + ', ' + scheduled.label + '.' : '') + '\n\nShopLab', 'order_confirmation', { orderId: order.id });
      return ok(201, orderView(order), { location: '/api/orders/' + order.id });
    });
    route('GET', '/api/orders', 'user', c => {
      let list = db.orders.filter(o => c.user.role === 'admin' || o.userId === c.user.id).map(orderView);
      if (c.query.status) list = list.filter(o => o.status === c.query.status);
      const s = c.query.sort || 'newest';
      const sorts = { newest: (a, b) => b.id - a.id, oldest: (a, b) => a.id - b.id, total_desc: (a, b) => b.total - a.total };
      if (!sorts[s]) return err(400, 'INVALID_QUERY', 'Sort must be newest, oldest or total_desc.');
      list.sort(sorts[s]);
      return ok(200, { data: list, meta: { total: list.length } });
    });
    function ownOrder(c) {
      const id = parseId(c.params.id);
      if (isNaN(id)) return { error: err(400, 'INVALID_ID', 'Order id must be a number.') };
      const o = db.orders.find(x => x.id === id);
      if (!o) return { error: err(404, 'ORDER_NOT_FOUND', 'No order has id ' + id + '.') };
      if (o.userId !== c.user.id && c.user.role !== 'admin') return { error: err(403, 'FORBIDDEN', 'That order belongs to another user.') };
      return { order: o };
    }
    route('GET', '/api/orders/:id', 'user', c => { const r = ownOrder(c); return r.error || ok(200, orderView(r.order)); });
    route('POST', '/api/orders/:id/cancel', 'user', c => {
      const r = ownOrder(c); if (r.error) return r.error;
      const st = orderStatus(r.order);
      if (st !== 'placed' && st !== 'processing') return err(409, 'ORDER_NOT_CANCELLABLE', 'Orders that are ' + st + ' cannot be cancelled.');
      r.order.cancelledAt = new Date().toISOString();
      r.order.items.forEach(i => { const p = findProduct(i.productId); if (p) { const before = p.stock; p.stock += i.quantity; stockRaised(p, before); } });
      sendEmail(r.order.shippingAddress.email || c.user.email, 'Order #' + r.order.id + ' was cancelled', 'Order #' + r.order.id + ' was cancelled. Your refund of $' + r.order.total.toFixed(2) + ' goes back to your original payment method (' + (r.order.payment.label || r.order.payment.brand) + ').\n\nShopLab', 'order_cancelled', { orderId: r.order.id });
      return ok(200, orderView(r.order));
    });
    route('POST', '/api/orders/:id/return', 'user', c => {
      const r = ownOrder(c); if (r.error) return r.error;
      const o = r.order;
      if (o.returnRequest) return err(409, 'RETURN_ALREADY_REQUESTED', 'A return was already requested for order #' + o.id + ' (' + o.returnRequest.rma + ').');
      const st = orderStatus(o);
      if (st !== 'delivered') return err(409, 'RETURN_NOT_ALLOWED', 'Only delivered orders can be returned. This order is ' + st.replace('_', ' ') + '.');
      const reason = str(c.body.reason), comment = str(c.body.comment), d = [];
      if (!RETURN_REASONS[reason]) d.push({ field: 'reason', message: 'Reason must be one of: ' + Object.keys(RETURN_REASONS).join(', ') + '.' });
      if (reason === 'other' && comment.length < 5) d.push({ field: 'comment', message: 'Tell us more (at least 5 characters) when the reason is other.' });
      let ids = Array.isArray(c.body.productIds) ? c.body.productIds : o.items.map(i => i.productId);
      if (!ids.length || ids.some(id => !o.items.some(i => i.productId === id))) d.push({ field: 'productIds', message: 'Choose at least one item from this order.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'The return request has errors.', d);
      const items = o.items.filter(i => ids.includes(i.productId));
      const amount = round(items.reduce((s, i) => s + i.lineTotal, 0) * (1 + TAX_RATE));
      o.returnRequest = { rma: 'RMA-' + o.id, reason, reasonLabel: RETURN_REASONS[reason], comment, productIds: ids, refundAmount: amount, requestedAt: new Date().toISOString() };
      sendEmail(o.shippingAddress.email || c.user.email, 'Return ' + o.returnRequest.rma + ' received', 'We received your return request for order #' + o.id + '.\n\nReturn number: ' + o.returnRequest.rma + '\nReason: ' + RETURN_REASONS[reason] + '\nItems: ' + items.map(i => i.name).join(', ') + '\nExpected refund: $' + amount.toFixed(2) + '\n\nPack the items and drop them at any courier point within 14 days.\n\nShopLab', 'return_requested', { orderId: o.id, rma: o.returnRequest.rma });
      return ok(201, orderView(o));
    });
    route('POST', '/api/orders/:id/reorder', 'user', c => {
      const r = ownOrder(c); if (r.error) return r.error;
      const cart = getCart(c.user.id), added = [], skipped = [];
      r.order.items.forEach(i => {
        const p = findProduct(i.productId);
        if (!p) return skipped.push({ productId: i.productId, name: i.name, reason: 'No longer sold' });
        const line = cart.items.find(x => x.productId === p.id), have = line ? line.quantity : 0;
        const q = Math.min(i.quantity, p.stock - have, 10 - have);
        if (p.stock === 0) return skipped.push({ productId: p.id, name: p.name, reason: 'Out of stock' });
        if (q <= 0) return skipped.push({ productId: p.id, name: p.name, reason: 'Cart already holds the maximum available' });
        if (line) line.quantity += q; else cart.items.push({ productId: p.id, quantity: q });
        added.push({ productId: p.id, name: p.name, quantity: q });
      });
      return ok(200, { added, skipped, cart: cartView(c.user.id) });
    });
    route('POST', '/api/orders/track', null, c => {
      const id = Number(c.body.orderId), email = str(c.body.email).toLowerCase(), d = [];
      if (!Number.isInteger(id)) d.push({ field: 'orderId', message: 'Enter the order number.' });
      if (!EMAIL_RE.test(email)) d.push({ field: 'email', message: 'Enter the email used for the order.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Enter an order number and email.', d);
      const o = db.orders.find(x => x.id === id);
      const owner = o && db.users.find(u => u.id === o.userId);
      if (!o || ![(o.shippingAddress.email || '').toLowerCase(), owner ? owner.email.toLowerCase() : ''].includes(email)) return err(404, 'ORDER_NOT_FOUND', 'No order matches that number and email.');
      return ok(200, { id: o.id, status: orderStatus(o), createdAt: o.createdAt, itemCount: o.items.reduce((s, i) => s + i.quantity, 0), total: o.total, shippingMethod: o.shippingMethod, shipTo: o.shippingAddress.city + ', ' + o.shippingAddress.country, rma: o.returnRequest ? o.returnRequest.rma : null });
    });
    route('PATCH', '/api/orders/:id/status', 'admin', c => {
      const id = parseId(c.params.id), o = db.orders.find(x => x.id === id);

        if (!o.returnRequest) return err(409, 'NO_RETURN', 'Only orders with a return request can be refunded.');

        sendEmail(o.shippingAddress.email, 'Refund issued for ' + o.returnRequest.rma, 'We refunded $' + o.returnRequest.refundAmount.toFixed(2) + ' to your original payment method (' + (o.payment.label || o.payment.brand) + ').\n\nShopLab', 'refund_issued', { orderId: o.id });
      } else {
        if (o.returnRequest) return err(409, 'ORDER_CLOSED', 'Order #' + o.id + ' has a return in progress. Set it to refunded instead.');
        o.statusOverride = s;
      }
      sweepOrders();
      return ok(200, orderView(o));
    });

    // ---------- inbox, newsletter and chaos config ----------
    route('GET', '/api/inbox', null, c => {
      const e = str(c.query.email).toLowerCase();
      if (!EMAIL_RE.test(e)) return err(400, 'VALIDATION_ERROR', 'Pass the mailbox address as ?email=you@example.com.', [{ field: 'email', message: 'Enter a valid email address.' }]);
      const list = db.emails.filter(m => m.to === e).sort((a, b) => b.id - a.id);
      return ok(200, { data: list.map(m => ({ id: m.id, from: m.from, to: m.to, subject: m.subject, kind: m.kind, read: m.read, createdAt: m.createdAt, preview: m.body.replace(/\s+/g, ' ').slice(0, 90) })), meta: { total: list.length, unread: list.filter(m => !m.read).length } });
    });
    route('GET', '/api/inbox/:id', null, c => {
      const m = db.emails.find(x => x.id === parseId(c.params.id));

    });
    route('DELETE', '/api/inbox', null, c => {
      const e = str(c.query.email).toLowerCase();

    route('POST', '/api/newsletter', null, c => {
      const e = str(c.body.email).toLowerCase();

    });
    route('GET', '/api/config', null, () => ok(200, db.config));
    route('PUT', '/api/config', null, c => {
      const b = c.body, d = [];

      if (!isInt(fr) || fr < 0 || fr > 50) d.push({ field: 'failureRate', message: 'Use a whole number from 0 to 50.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some settings are invalid.', d);

    // ---------- users ----------
    route('GET', '/api/users', 'admin', () => ok(200, { data: db.users.map(publicUser) }));
    route('GET', '/api/users/:id', 'admin', c => { const u = db.users.find(x => x.id === parseId(c.params.id)); return u ? ok(200, publicUser(u)) : err(404, 'USER_NOT_FOUND', 'No user has id ' + c.params.id + '.'); });

    function handle(req) {
      const method = String(req.method || 'GET').toUpperCase();
      const path = (String(req.path || '/').replace(/\/+$/, '')) || '/';
      const headers = {};
      Object.keys(req.headers || {}).forEach(k => { headers[k.toLowerCase()] = String(req.headers[k]); });
      let res = null;
      const exempt = ['/api/config', '/api/reset', '/api/health'].includes(path) || !path.startsWith('/api/');
      try {
        sweepOrders();
        if (method === 'OPTIONS') res = ok(204, null);
        else if (!exempt && db.config.failureRate > 0 && Math.random() * 100 < db.config.failureRate) res = err(503, 'CHAOS_FAILURE', 'Injected failure: chaos mode is on (' + db.config.failureRate + '% failure rate). Retry the request.');

          for (const r of routes) {
            const m = r.re.exec(path);
            if (!m) continue;
            pathHit = true;
            if (r.method !== method) continue;
            const params = {}; r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
            match = { r, params }; break;
          }
          if (!match) res = pathHit ? err(405, 'METHOD_NOT_ALLOWED', method + ' is not supported on ' + path + '.') : err(404, 'ROUTE_NOT_FOUND', 'No endpoint matches ' + method + ' ' + path + '.');
          else {
            const body = req.body && typeof req.body === 'object' && !Array.isArray(req.body) ? req.body : {};
            const ctx = { req, method, path, params: match.params, query: req.query || {}, headers, body, rawBody: req.body };
            if (match.r.auth) {
              const a = authenticate(headers);
              if (a.error) res = a.error;
              else {
                ctx.user = a.user; ctx.token = a.token; ctx.session = a.session;
                if (match.r.auth === 'admin' && a.user.role !== 'admin') res = err(403, 'FORBIDDEN', 'This endpoint is for admin users only.');
              }
            }
            if (!res) res = match.r.fn(ctx);
          }
        }
      } catch (e) {
        res = err(500, 'INTERNAL_ERROR', 'Unexpected server error: ' + e.message);
      }
      if (method === 'GET' && res.status === 200 && !res.raw && res.body) {
        if (/^\/api\/(products(\/\d+)?|categories)$/.test(path)) {
          const tag = 'W/"' + hashText(JSON.stringify(res.body)) + '"';
          if (headers['if-none-match'] === tag) res = { status: 304, body: null, headers: {}, delay: res.delay };
          res.headers = Object.assign(res.headers || {}, { etag: tag, 'cache-control': 'no-cache' });
        } else if (headers.authorization) res.headers = Object.assign(res.headers || {}, { 'cache-control': 'no-store' });
      }
      res.headers = Object.assign({ 'x-request-id': 'req_' + rid(12), 'x-powered-by': 'ShopLab' }, res.headers || {});
      if (res.body !== null && res.body !== undefined && !res.raw) res.headers['content-type'] = 'application/json; charset=utf-8';
      res.delay = (res.delay || 0) + (exempt ? 0 : db.config.latencyMs);
      save();
      return res;
    }

    function reload() { if (!opts.load) return; try { const d = opts.load(); if (d && d.version === 2) db = d; } catch (e) { /* keep current */ } }
    return { handle, reload, reset: () => { db = seed(); save(); } };
  }

  return { createBackend, seed, PASSWORD, TEST_USERS, ENDPOINTS, GROUPS, CATEGORIES, SHIPPING, COUPONS, RETURN_REASONS, BANKS, SLOTS, GIFT_WRAP, COD_FEE, COD_LIMIT };
})();

        out = { status: res.status, headers: res.headers, body: res.body, url: 'in-page' + u.pathname + u.search };
      }
