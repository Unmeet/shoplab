  let loadSeq = 0;
  async function loadProducts() {
    const f = S.filters, grid = $('#product-grid');
    if (!grid) return;
    const seq = ++loadSeq;
    grid.setAttribute('aria-busy', 'true');
    grid.innerHTML = Array.from({ length: 4 }, () => '<div class="skeleton" data-testid="product-skeleton"></div>').join('');
    const q = new URLSearchParams({ page: f.page, limit: f.limit, sort: f.sort });
    if (f.search) q.set('search', f.search);
    if (f.categories.length) q.set('category', f.categories.join(','));
    if (f.maxPrice < 200) q.set('maxPrice', f.maxPrice);
    if (f.minRating) q.set('minRating', f.minRating);
    if (f.inStock) q.set('inStock', 'true');
    const r = await request('GET', '/api/products?' + q, { auth: false });
    if (seq !== loadSeq || !$('#product-grid')) return;
    grid.removeAttribute('aria-busy');
    const chips = [];
    if (f.search) chips.push(['search', `Search: ${f.search}`]);
    f.categories.forEach(c => chips.push(['cat:' + c, catName(c)]));
    if (f.maxPrice < 200) chips.push(['price', `Up to $${f.maxPrice}`]);
    if (f.minRating) chips.push(['rating', `${f.minRating}★ and up`]);
    if (f.inStock) chips.push(['stock', 'In stock']);
    $('#active-filters').innerHTML = chips.map(c => `<button type="button" class="chip" data-chip="${esc(c[0])}" data-testid="filter-chip" aria-label="Remove filter ${esc(c[1])}">${esc(c[1])}<span aria-hidden="true">✕</span></button>`).join('');
    $$('#active-filters .chip').forEach(b => b.onclick = () => {
      const k = b.dataset.chip;
      if (k === 'search') { f.search = ''; $('#search-input').value = ''; }
      else if (k.startsWith('cat:')) { f.categories = f.categories.filter(c => c !== k.slice(4)); const cb = $('#cat-' + k.slice(4)); if (cb) cb.checked = false; }
      else if (k === 'price') { f.maxPrice = 200; $('#price-max').value = 200; $('#price-max-value').textContent = '$200'; }
      else if (k === 'rating') { f.minRating = 0; $('#rating-0').checked = true; }
      else if (k === 'stock') { f.inStock = false; $('#in-stock').checked = false; }
      f.page = 1; loadProducts();
    });
    if (!r.ok) { grid.innerHTML = `<div class="alert error" role="alert">${esc(errMsg(r))}</div>`; return; }
    const { data, meta } = r.body;
    $('#results-title').textContent = f.search ? `Results for “${f.search}”` : 'All products';
    $('#results-count').textContent = meta.total ? `Showing ${(meta.page - 1) * meta.limit + 1}–${(meta.page - 1) * meta.limit + data.length} of ${meta.total} products` : '0 products';
    grid.innerHTML = data.length ? data.map(productCard).join('') : `<div class="empty" data-testid="no-results" style="grid-column:1/-1"><p class="big" aria-hidden="true">🔍</p><h3>No products match these filters</h3><p class="muted">Remove a filter or search for something else.</p><button class="btn ghost" type="button" id="empty-clear">Clear all filters</button></div>`;
    const ec = $('#empty-clear'); if (ec) ec.onclick = () => $('#clear-filters').click();
    const pg = $('#pagination');
    if (meta.totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button type="button" id="page-prev" data-testid="page-prev" ${meta.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹ Prev</button>`;
    for (let i = 1; i <= meta.totalPages; i++) html += `<button type="button" data-page="${i}" id="page-${i}" data-testid="page-${i}" ${i === meta.page ? 'aria-current="page"' : ''}>${i}</button>`;
    html += `<button type="button" id="page-next" data-testid="page-next" ${meta.page === meta.totalPages ? 'disabled' : ''} aria-label="Next page">Next ›</button>`;
    pg.innerHTML = html;
    const to = p => { f.page = p; loadProducts(); $('#results-title').scrollIntoView({ block: 'start' }); };
    $$('[data-page]', pg).forEach(b => b.onclick = () => to(+b.dataset.page));
    $('#page-prev').onclick = () => to(meta.page - 1);
    $('#page-next').onclick = () => to(meta.page + 1);
  }

  // ---------------- checkout ----------------
  const COUNTRIES = [['US', 'United States'], ['IN', 'India'], ['GB', 'United Kingdom'], ['CA', 'Canada'], ['DE', 'Germany'], ['AU', 'Australia']];
  async function viewCheckout() {

        ${field('line1', 'Street address', { id: 'co-line1', value: a.line1, cls: 'full', attrs: { required: true, autocomplete: 'address-line1', 'data-label': 'a street address' } })}

        ${field('country', 'Country', { id: 'co-country', value: a.country, select: [['', 'Choose a country']].concat(COUNTRIES), attrs: { required: true, 'data-label': 'a country' } })}
        </div><div class="form-actions"><a class="btn ghost" href="#cart" id="back-to-cart">Back to cart</a><button class="btn" type="submit" id="continue-to-delivery" data-testid="continue-button">Continue to delivery</button></div></form>`;
      $('#address-form').onsubmit = e => {
        e.preventDefault();
        const f = e.target;
        if (!validateForm(f)) return;

    } else if (ck.step === 2) {
      panel.innerHTML = `<h2>Delivery method</h2><form id="delivery-form" data-testid="delivery-form"><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">Delivery method</legend>
        ${Object.values(ShopLabCore.SHIPPING).map(m => `<label class="ship-option" for="ship-${m.id}"><input type="radio" name="method" value="${m.id}" id="ship-${m.id}" data-testid="ship-${m.id}" ${S.cart.shippingMethod === m.id ? 'checked' : ''}><span><strong>${m.label}</strong><br><span class="muted" style="font-size:.88rem">${m.eta}${m.freeOver ? `, free over $${m.freeOver}` : ''}</span></span><span class="price">${money(m.price)}</span></label>`).join('')}
        </fieldset><div class="form-actions"><button type="button" class="btn ghost" id="back-to-address">Back</button><button class="btn" type="submit" id="continue-to-payment" data-testid="continue-button">Continue to payment</button></div></form>`;
      $$('input[name="method"]').forEach(i => i.onchange = async () => { const res = await request('PUT', '/api/cart/shipping', { body: { method: i.value } }); if (res.ok) { S.cart = res.body; const old = $('.summary'); old.outerHTML = summaryHtml(S.cart); } });

        <form id="payment-form" novalidate data-testid="payment-form" autocomplete="off"><div class="form-grid">

        ${field('cardNumber', 'Card number', { id: 'card-number', cls: 'full', value: ck.payment ? ck.payment.cardNumber : '', attrs: { required: true, inputmode: 'numeric', placeholder: '4111 1111 1111 1111', maxlength: 23, pattern: '[\\d ]{13,23}', 'data-msg': 'Enter 13–19 digits.', 'data-label': 'a card number' } })}
        ${field('expiry', 'Expiry (MM/YY)', { id: 'card-expiry', value: ck.payment ? ck.payment.expiry : '', attrs: { required: true, placeholder: 'MM/YY', maxlength: 5, pattern: '(0[1-9]|1[0-2])\\/\\d{2}', 'data-msg': 'Use the format MM/YY.', 'data-label': 'an expiry date' } })}
        ${field('cvv', 'CVV', { id: 'card-cvv', type: 'password', attrs: { required: true, inputmode: 'numeric', maxlength: 4, pattern: '\\d{3,4}', 'data-msg': 'CVV is 3 or 4 digits.', 'data-label': 'the CVV' } })}

      const num = $('#card-number');

      $('#back-to-delivery').onclick = () => { ck.step = 2; viewCheckout(); };
      $('#payment-form').onsubmit = e => {
        e.preventDefault();
        if (!validateForm(e.target)) return;

        ck.step = 4; viewCheckout();
      };
    } else {
      const ad = ck.address, pm = ck.payment || {};
      panel.innerHTML = `<h2>Review and place order</h2>
        <h3>Ship to</h3><p id="review-address" data-testid="review-address">${esc(ad.fullName)}<br>${esc(ad.line1)}${ad.line2 ? ', ' + esc(ad.line2) : ''}<br>${esc(ad.city)}, ${esc(ad.state)} ${esc(ad.zip)}, ${esc(ad.country)}<br>${esc(ad.phone)}</p>
        <h3>Delivery</h3><p id="review-delivery">${esc(ShopLabCore.SHIPPING[S.cart.shippingMethod].label)} (${esc(ShopLabCore.SHIPPING[S.cart.shippingMethod].eta)})</p>
        <h3>Payment</h3><p id="review-payment">Card ending ${esc(String(pm.cardNumber || '').replace(/\D/g, '').slice(-4))}</p>
        <h3>Items</h3><ul id="review-items" data-testid="review-items">${S.cart.items.map(i => `<li>${esc(i.name)} × ${i.quantity}: ${money(i.lineTotal)}</li>`).join('')}</ul>
        <div class="alert error" id="order-error" data-testid="order-error" role="alert" hidden></div>
        <label class="check"><input type="checkbox" id="accept-terms" data-testid="accept-terms"> I agree to the practice store terms.</label>
        <div class="form-actions"><button type="button" class="btn ghost" id="back-to-payment">Edit payment</button><button type="button" class="btn" id="place-order" data-testid="place-order" disabled>Place order (${money(S.cart.total)})</button></div>`;
      $('#accept-terms').onchange = e => { $('#place-order').disabled = !e.target.checked; };
      $('#back-to-payment').onclick = () => { ck.step = 3; viewCheckout(); };
      $('#place-order').onclick = async () => {
        const btn = $('#place-order'); setBusy(btn, true, 'Placing order…');
        const res = await request('POST', '/api/orders', { body: { shippingAddress: ad, payment: pm } });
        setBusy(btn, false);
        if (!res.ok) {
          const box = $('#order-error'); box.hidden = false;
          const d = res.body && res.body.error && res.body.error.details;

        S.cart = null; await refreshCounts();
        renderOrderPlaced();

  }
  function renderOrderPlaced() {
    const o = S.checkout.placed;

    app.innerHTML = `<div class="panel success-box" data-testid="order-confirmation"><p class="big" aria-hidden="true">🎉</p><h1>Thank you, your order is placed</h1>

      <div class="hero-actions" style="justify-content:center"><a class="btn" href="#order-${o.id}" id="view-order">View order</a><a class="btn ghost" href="#shop" id="keep-shopping">Keep shopping</a></div></div>`;
  }

  // ---------------- orders ----------------
  let orderFilter = { status: '', sort: 'newest' };
  async function viewOrders() {
    if (!requireLogin('orders')) return;
    app.innerHTML = `<div class="page-head"><h1>My orders</h1><p>Statuses update over time. Cancel an order while it is placed or processing.</p></div>
      <div class="table-tools"><label>Status <select id="order-status-filter" data-testid="order-status-filter">${['', 'placed', 'processing', 'shipped', 'delivered', 'cancelled'].map(s => `<option value="${s}" ${orderFilter.status === s ? 'selected' : ''}>${s ? s[0].toUpperCase() + s.slice(1) : 'All statuses'}</option>`).join('')}</select></label>
      <label>Sort <select id="order-sort" data-testid="order-sort">${[['newest', 'Newest first'], ['oldest', 'Oldest first'], ['total_desc', 'Highest total']].map(o => `<option value="${o[0]}" ${orderFilter.sort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label></div>
      <div id="orders-table"></div>`;
    $('#order-status-filter').onchange = e => { orderFilter.status = e.target.value; loadOrders(); };
    $('#order-sort').onchange = e => { orderFilter.sort = e.target.value; loadOrders(); };
    loadOrders();
  }
  async function loadOrders() {
    const box = $('#orders-table');
    box.innerHTML = '<div class="skeleton" style="height:160px"></div>';
    const q = new URLSearchParams({ sort: orderFilter.sort }); if (orderFilter.status) q.set('status', orderFilter.status);
    const r = await request('GET', '/api/orders?' + q);
    if (!r.ok) { box.innerHTML = `<div class="alert error">${esc(errMsg(r))}</div>`; return; }
    const list = r.body.data;
    if (!list.length) { box.innerHTML = `<div class="empty" data-testid="no-orders"><p class="big" aria-hidden="true">📦</p><h2>No orders ${orderFilter.status ? 'with this status' : 'yet'}</h2><p class="muted">Orders you place show up here.</p><a href="#shop" class="btn">Start shopping</a></div>`; return; }
    box.innerHTML = `<div class="table-wrap"><table class="data" id="orders" data-testid="orders-table"><caption class="sr-only">Your orders</caption><thead><tr><th scope="col">Order</th><th scope="col">Placed</th><th scope="col">Items</th><th scope="col" class="num">Total</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody>
      ${list.map(o => `<tr data-testid="order-row" data-order-id="${o.id}" id="order-row-${o.id}"><td><a href="#order-${o.id}" data-testid="order-link">#${o.id}</a></td><td>${new Date(o.createdAt).toLocaleString()}</td><td>${o.items.reduce((s, i) => s + i.quantity, 0)}</td><td class="num">${money(o.total)}</td><td><span class="status ${o.status}" data-testid="order-status">${o.status}</span></td>
      <td>${o.status === 'placed' || o.status === 'processing' ? `<button type="button" class="btn danger small" data-cancel="${o.id}" id="cancel-order-${o.id}" data-testid="cancel-order">Cancel</button>` : '<span class="muted">None</span>'}</td></tr>`).join('')}
      </tbody></table></div>`;
    $$('[data-cancel]').forEach(b => b.onclick = () => cancelOrder(+b.dataset.cancel, loadOrders));
  }
  async function cancelOrder(id, after) {
    if (!(await confirmDialog(`Cancel order #${id}?`, 'Items go back into stock. You cannot undo this.', 'Cancel order'))) return;
    const r = await request('POST', `/api/orders/${id}/cancel`);
    if (r.ok) { toast(`Order #${id} cancelled.`, 'success'); after(); } else toast(errMsg(r), 'error');
  }
  async function viewOrder(id) {
    if (!requireLogin('order-' + id)) return;

    if (!r.ok) { app.innerHTML = `<div class="empty" data-testid="order-error"><h1>Order unavailable</h1><p>${esc(errMsg(r))}</p><a class="btn" href="#orders">Back to orders</a></div>`; return; }

    document.title = `Order #${o.id} | ShopLab`;
    app.innerHTML = `<nav class="crumbs"><a href="#orders">My orders</a> / Order #${o.id}</nav>
      <div class="page-head"><h1 id="order-heading">Order #${o.id}</h1><p>Placed ${new Date(o.createdAt).toLocaleString()}. Status: <span class="status ${o.status}" id="order-detail-status" data-testid="order-detail-status">${o.status}</span></p></div>

      <div class="two-col"><div class="panel"><h2>Items</h2>${o.items.map(i => `<div class="cart-line" data-testid="order-item">${thumb(i)}<div><h3>${esc(i.name)}</h3><p class="muted" style="margin:0">${money(i.price)} × ${i.quantity}</p></div><span></span><strong class="num">${money(i.lineTotal)}</strong></div>`).join('')}
        <h2 style="margin-top:1rem">Ship to</h2><p>${esc(o.shippingAddress.fullName)}<br>${esc(o.shippingAddress.line1)}<br>${esc(o.shippingAddress.city)}, ${esc(o.shippingAddress.state)} ${esc(o.shippingAddress.zip)}, ${esc(o.shippingAddress.country)}</p>
        <p class="muted">Paid with ${esc(o.payment.brand)} ending ${esc(o.payment.last4)}</p>
        <div class="form-actions"><button type="button" class="btn ghost" id="refresh-order" data-testid="refresh-order">Refresh status</button>${o.status === 'placed' || o.status === 'processing' ? `<button type="button" class="btn danger" id="cancel-this-order" data-testid="cancel-order">Cancel order</button>` : ''}</div></div>
        ${summaryHtml({ itemCount: o.items.reduce((s, i) => s + i.quantity, 0), subtotal: o.subtotal, discount: o.discount, coupon: { code: o.coupon }, shippingMethod: o.shippingMethod, shipping: o.shipping, tax: o.tax, total: o.total })}</div>`;
    $('#refresh-order').onclick = () => viewOrder(id);
    const c = $('#cancel-this-order'); if (c) c.onclick = () => cancelOrder(id, () => viewOrder(id));
  }

  // ---------------- auth ----------------
  function viewLogin() {
    if (S.user) { go('account'); return; }
    app.innerHTML = `<div class="auth"><div class="panel"><h1>Log in</h1><p class="muted">Use one of the test accounts or create your own.</p>
      <div class="alert error" id="login-error" data-testid="login-error" role="alert" hidden></div>
      <form id="login-form" novalidate data-testid="login-form">
        ${field('username', 'Username or email', { id: 'username', attrs: { required: true, autocomplete: 'username', 'data-label': 'your username or email' } })}

        <button class="btn" type="submit" id="login-button" data-testid="login-button" style="width:100%;margin-top:.8rem">Log in</button>
      </form><p style="margin-top:1rem">New here? <a href="#register" id="go-register">Create an account</a></p></div>
      <div class="panel"><h2>Test accounts</h2><p class="muted">Select an account to fill the form. Password for all: <code>${ShopLabCore.PASSWORD}</code></p>
        <ul class="account-list" data-testid="account-list">${ShopLabCore.TEST_USERS.map(u => `<li><button type="button" class="btn ghost small" data-fill="${u.username}" id="fill-${u.username}">Use</button><div><strong>${u.username}</strong><p>${esc(u.behaviour)}</p></div></li>`).join('')}</ul></div></div>`;
    $('#toggle-password').onclick = e => { const p = $('#password'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; e.target.setAttribute('aria-pressed', String(show)); };
    $$('[data-fill]').forEach(b => b.onclick = () => { $('#username').value = b.dataset.fill; $('#password').value = ShopLabCore.PASSWORD; $('#login-button').focus(); });
    $('#login-form').onsubmit = async e => {

  async function loggedIn(body, msg) {
    setToken(body.token); S.user = body.user; S.session = { expiresAt: body.expiresAt };
    renderUserMenu(); await refreshCounts(); toast(msg, 'success');
    const to = S.redirect || 'shop'; S.redirect = null; go(to);
  }
  function viewRegister() {
    if (S.user) { go('account'); return; }
    app.innerHTML = `<div class="auth"><div class="panel"><h1>Create an account</h1>
      <div class="alert error" id="register-error" data-testid="register-error" role="alert" hidden></div>
      <form id="register-form" novalidate data-testid="register-form"><div class="form-grid">
        ${field('firstName', 'First name', { id: 'reg-first', attrs: { required: true, 'data-label': 'your first name', autocomplete: 'given-name' } })}
        ${field('lastName', 'Last name', { id: 'reg-last', attrs: { required: true, 'data-label': 'your last name', autocomplete: 'family-name' } })}
        ${field('username', 'Username', { id: 'reg-username', cls: 'full', attrs: { required: true, pattern: '[A-Za-z0-9_]{3,20}', 'data-msg': 'Use 3–20 letters, numbers or underscores.', 'data-label': 'a username', autocomplete: 'username' } })}
        ${field('email', 'Email', { id: 'reg-email', type: 'email', cls: 'full', attrs: { required: true, 'data-label': 'your email', autocomplete: 'email' } })}
        <div class="field full"><label for="reg-password">Password</label><input id="reg-password" name="password" type="password" data-testid="reg-password" required data-label="a password" autocomplete="new-password" aria-describedby="pw-hint">
          <div class="meter" aria-hidden="true"><i id="pw-meter"></i></div><p class="muted" id="pw-hint" style="font-size:.82rem;margin:.3rem 0 0">Strength: <span id="pw-strength" data-testid="pw-strength">too short</span>. Use 8+ characters with upper and lower case, a number and a symbol.</p>
          <div class="field-error" id="reg-password-error" data-error-for="password" role="alert"></div></div>
        ${field('confirm', 'Confirm password', { id: 'reg-confirm', type: 'password', cls: 'full', attrs: { required: true, 'data-label': 'the password again', autocomplete: 'new-password' } })}
        </div>
        <label class="check"><input type="checkbox" name="terms" id="reg-terms" data-testid="reg-terms" required data-msg="Accept the terms to create an account."> I accept the practice store terms</label><div class="field-error" data-error-for="terms" id="reg-terms-error" role="alert"></div>
        <button class="btn" type="submit" id="register-button" data-testid="register-button" style="width:100%;margin-top:.8rem">Create account</button></form>
      <p style="margin-top:1rem">Already registered? <a href="#login" id="go-login">Log in</a></p></div>
      <div class="panel"><h2>What gets checked</h2><p>The form validates in the browser first and the API validates again. Try a taken username like <code>standard_user</code>, a weak password, or mismatched passwords to see each error.</p></div></div>`;
    const pw = $('#reg-password');
    pw.oninput = () => {
      const v = pw.value; let s = 0;
      if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
      const lab = v.length < 8 ? 'too short' : ['weak', 'weak', 'fair', 'good', 'strong'][s];
      $('#pw-strength').textContent = lab;
      const m = $('#pw-meter'); m.style.width = (s * 25) + '%'; m.style.background = s >= 4 ? 'var(--ok)' : s >= 3 ? 'var(--tag)' : 'var(--bad)';
    };
    $('#register-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, box = $('#register-error'); box.hidden = true;
      if (!validateForm(f)) return;
      if ($('#reg-confirm').value !== pw.value) { showError(f, 'confirm', 'Passwords do not match.'); $('#reg-confirm').focus(); return; }
      const d = Object.fromEntries(new FormData(f).entries());
      const btn = $('#register-button'); setBusy(btn, true, 'Creating account…');
      const r = await request('POST', '/api/auth/register', { body: { username: d.username, email: d.email, password: d.password, firstName: d.firstName, lastName: d.lastName }, auth: false });
      setBusy(btn, false);
      if (!r.ok) return applyServerErrors(f, r, box);
      await loggedIn(r.body, `Account created. Welcome, ${r.body.user.firstName}.`);
    };
  }

  // ---------------- account, wishlist, admin ----------------
  async function viewAccount() {
    if (!requireLogin('account')) return;
    const r = await request('GET', '/api/auth/me');
    if (!r.ok) return;
    const u = S.user = r.body.user; S.session = r.body.session;
    app.innerHTML = `<div class="page-head"><h1>My account</h1><p>Signed in as <strong id="account-username" data-testid="account-username">${esc(u.username)}</strong> (${esc(u.role)}).</p></div>
      <div class="two-col" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="panel"><h2>Profile</h2>
        <div class="alert error" id="profile-error" role="alert" hidden></div>
        <form id="profile-form" novalidate data-testid="profile-form"><div class="form-grid">
          ${field('firstName', 'First name', { id: 'profile-first', value: u.firstName, attrs: { required: true, 'data-label': 'your first name' } })}
          ${field('lastName', 'Last name', { id: 'profile-last', value: u.lastName, attrs: { required: true, 'data-label': 'your last name' } })}
          ${field('email', 'Email', { id: 'profile-email', type: 'email', value: u.email, cls: 'full', attrs: { required: true, 'data-label': 'your email' } })}
          ${field('phone', 'Phone', { id: 'profile-phone', type: 'tel', value: u.phone, cls: 'full' })}
        </div><button class="btn" type="submit" id="save-profile" data-testid="save-profile">Save changes</button></form></div>
        <div class="panel"><h2>API token</h2><p class="muted">Use this token as <code>Authorization: Bearer …</code> in Postman or your API tests.</p>
          <div class="field"><label for="token-value">Current token</label><input id="token-value" data-testid="token-value" type="password" readonly value="${esc(S.token)}"></div>
          <div class="row-btns"><button type="button" class="btn ghost small" id="show-token">Show token</button><button type="button" class="btn ghost small" id="copy-token" data-testid="copy-token">Copy token</button></div>
          <p class="muted" id="token-expiry">Expires ${new Date(r.body.session.expiresAt).toLocaleString()}.</p>
          <button type="button" class="btn danger" id="account-logout">Log out</button></div></div>`;
    $('#show-token').onclick = e => { const t = $('#token-value'), s = t.type === 'password'; t.type = s ? 'text' : 'password'; e.target.textContent = s ? 'Hide token' : 'Show token'; };
    $('#copy-token').onclick = async () => { try { await navigator.clipboard.writeText(S.token); toast('Token copied.', 'success'); } catch (e) { const t = $('#token-value'); t.type = 'text'; t.select(); toast('Copying is blocked here. The token is selected, so copy it manually.', 'info'); } };
    $('#account-logout').onclick = logout;
    $('#profile-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, box = $('#profile-error'); box.hidden = true;
      if (!validateForm(f)) return;
      const btn = $('#save-profile'); setBusy(btn, true, 'Saving…');
      const res = await request('PATCH', '/api/auth/me', { body: Object.fromEntries(new FormData(f).entries()) });
      setBusy(btn, false);
      if (!res.ok) return applyServerErrors(f, res, box);
      S.user = res.body.user; renderUserMenu(); toast('Profile saved.', 'success');
    };
  }
  async function viewWishlist() {
    if (!requireLogin('wishlist')) return;
    const r = await request('GET', '/api/wishlist');
    if (!r.ok) return;
    S.wishlistIds = new Set(r.body.data.map(p => p.id)); updateBadges();
    app.innerHTML = `<div class="page-head"><h1>Wishlist</h1><p>${r.body.data.length} saved item${r.body.data.length === 1 ? '' : 's'}.</p></div>
      ${r.body.data.length ? `<div class="grid" id="wishlist-grid" data-testid="wishlist-grid">${r.body.data.map(productCard).join('')}</div>` : `<div class="empty" data-testid="empty-wishlist"><p class="big" aria-hidden="true">♡</p><h2>No saved items</h2><p class="muted">Select the heart on any product to save it here.</p><a class="btn" href="#shop">Browse products</a></div>`}`;
  }
  async function viewAdmin() {
    if (!requireLogin('admin')) return;
    if (S.user.role !== 'admin') { app.innerHTML = `<div class="empty" data-testid="admin-forbidden"><p class="big" aria-hidden="true">🔒</p><h1>Admins only</h1><p class="muted">Log in as <code>admin</code> to manage products. The API returns 403 for other users.</p></div>`; return; }
    const [pr, ur] = await Promise.all([request('GET', '/api/products?limit=50'), request('GET', '/api/users')]);
    app.innerHTML = `<div class="page-head"><h1>Admin panel</h1><p>Edit stock and prices, add products, or delete them. Changes show up in the shop right away.</p></div>
      <div class="panel" style="margin-bottom:1.25rem"><h2>Add a product</h2><div class="alert error" id="add-product-error" role="alert" hidden></div>
        <form id="add-product-form" novalidate data-testid="add-product-form"><div class="form-grid">
          ${field('name', 'Name', { id: 'new-name', attrs: { required: true, minlength: 2, 'data-label': 'a product name' } })}
          ${field('category', 'Category', { id: 'new-category', select: [['', 'Choose a category']].concat(ShopLabCore.CATEGORIES.map(c => [c.id, c.name])), attrs: { required: true, 'data-label': 'a category' } })}
          ${field('price', 'Price (USD)', { id: 'new-price', type: 'number', attrs: { required: true, min: '0.01', step: '0.01', 'data-label': 'a price' } })}
          ${field('stock', 'Stock', { id: 'new-stock', type: 'number', attrs: { required: true, min: '0', step: '1', 'data-label': 'a stock count' } })}
          ${field('description', 'Description', { id: 'new-description', cls: 'full' })}
        </div><button class="btn" type="submit" id="add-product" data-testid="add-product">Add product</button></form></div>
      <h2>Products</h2><div class="table-wrap" style="margin-bottom:1.5rem"><table class="data" id="admin-products" data-testid="admin-products"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>
        ${pr.body.data.map(p => `<tr data-testid="admin-product-row" data-product-id="${p.id}" id="admin-row-${p.id}"><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(catName(p.category))}</td>
          <td><label class="sr-only" for="price-${p.id}">Price for ${esc(p.name)}</label><input type="number" step="0.01" min="0.01" id="price-${p.id}" value="${p.price}" data-testid="admin-price"></td>
          <td><label class="sr-only" for="stock-${p.id}">Stock for ${esc(p.name)}</label><input type="number" step="1" min="0" id="stock-${p.id}" value="${p.stock}" data-testid="admin-stock"></td>
          <td style="white-space:nowrap"><button type="button" class="btn small" data-save="${p.id}" id="save-${p.id}" data-testid="admin-save">Save</button> <button type="button" class="btn danger small" data-del="${p.id}" id="delete-${p.id}" data-testid="admin-delete">Delete</button></td></tr>`).join('')}
      </tbody></table></div>
      <h2>Users</h2><div class="table-wrap"><table class="data" id="admin-users" data-testid="admin-users"><thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>
        ${ur.ok ? ur.body.data.map(u => `<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.firstName + ' ' + u.lastName)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}</td></tr>`).join('') : ''}
      </tbody></table></div>`;
    $$('[data-save]').forEach(b => b.onclick = async () => {
      const id = b.dataset.save;
      setBusy(b, true, 'Saving…');
      const r = await request('PATCH', '/api/products/' + id, { body: { price: parseFloat($('#price-' + id).value), stock: parseInt($('#stock-' + id).value, 10) } });
      setBusy(b, false);
      toast(r.ok ? `Saved ${r.body.name}.` : errMsg(r), r.ok ? 'success' : 'error');
    });
    $$('[data-del]').forEach(b => b.onclick = async () => {
      if (!(await confirmDialog('Delete this product?', 'It disappears from the shop, carts and wishlists.', 'Delete product'))) return;
      const r = await request('DELETE', '/api/products/' + b.dataset.del);
      if (r.ok) { toast('Product deleted.', 'success'); $('#admin-row-' + b.dataset.del).remove(); } else toast(errMsg(r), 'error');
    });
    $('#add-product-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, box = $('#add-product-error'); box.hidden = true;
      if (!validateForm(f)) return;
      const d = Object.fromEntries(new FormData(f).entries());
      const r = await request('POST', '/api/products', { body: { name: d.name, category: d.category, price: parseFloat(d.price), stock: parseInt(d.stock, 10), description: d.description } });
      if (!r.ok) return applyServerErrors(f, r, box);
      toast(`Added ${r.body.name} (id ${r.body.id}).`, 'success'); S.categories = []; viewAdmin();
    };
  }

  // ---------------- API console ----------------
  function viewApi() {
    const groups = {};
    ['Auth', 'Products', 'Cart', 'Wishlist', 'Orders', 'Users', 'Utilities'].forEach(g => { groups[g] = []; });
    ShopLabCore.ENDPOINTS.forEach((e, i) => { groups[e.group].push([e, i]); });
    const base = MODE === 'server' ? location.origin : 'http://localhost:3000';
    app.innerHTML = `<div class="page-head"><h1>API console</h1><p>${MODE === 'server' ? `Requests go over HTTP to <code>${esc(base)}/api</code>, the same URL your API tests use.` : 'In demo mode requests are answered by the in-browser API, with the same rules and status codes as the server kit. Copy the cURL to run against the kit later.'} Pick an endpoint to load an example request.</p></div>
      <div class="api"><nav class="ep-list" aria-label="Endpoints" data-testid="endpoint-list">${Object.keys(groups).map(g => `<div class="ep-group"><h3>${esc(g)}</h3>${groups[g].map(([e, i]) => `<button type="button" class="ep" data-ep="${i}" data-testid="endpoint"><span class="method m-${e.method}">${e.method}</span><code>${esc(e.path)}</code><small>${esc(e.desc)} ${e.auth !== 'none' ? `<span class="lock">${e.auth === 'admin' ? 'Admin token.' : 'Needs token.'}</span>` : ''}</small></button>`).join('')}</div>`).join('')}</nav>
      <div class="panel" data-testid="api-console">
        <div class="req-line"><div><label for="api-method">Method</label><select id="api-method" data-testid="api-method">${['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map(m => `<option>${m}</option>`).join('')}</select></div>
          <div><label for="api-url">URL</label><input id="api-url" type="text" data-testid="api-url" value="/api/products?limit=3" spellcheck="false"></div>
          <button type="button" class="btn" id="api-send" data-testid="api-send">Send</button></div>
        <label class="check" style="margin-top:.6rem"><input type="checkbox" id="api-use-token" data-testid="api-use-token" checked> Send my login token ${S.token ? '' : '<span class="muted">(you are not logged in)</span>'}</label>
        <div class="form-grid" style="margin-top:.6rem"><div class="field"><label for="api-headers">Extra headers (JSON)</label><textarea id="api-headers" class="code-area" data-testid="api-headers" spellcheck="false">{}</textarea></div>
          <div class="field"><label for="api-body">Body (JSON)</label><textarea id="api-body" class="code-area" data-testid="api-body" spellcheck="false"></textarea></div></div>
        <div class="row-btns"><button type="button" class="btn ghost small" id="api-curl" data-testid="api-curl">Show as cURL</button><button type="button" class="btn ghost small" id="api-format">Format body</button></div>
        <pre class="out" id="api-curl-out" data-testid="api-curl-out" hidden></pre>
        <h2 style="margin-top:1.2rem">Response</h2><div class="resp-meta" id="api-meta" data-testid="api-meta"><span class="muted">Send a request to see the response.</span></div>
        <div class="tablist" role="tablist"><button role="tab" id="resp-tab-body" aria-selected="true">Body</button><button role="tab" id="resp-tab-headers" aria-selected="false">Headers</button></div>
        <pre class="out" id="api-response" data-testid="api-response" aria-live="polite"></pre><pre class="out" id="api-response-headers" data-testid="api-response-headers" hidden></pre>
      </div></div>`;
    $$('[data-ep]').forEach(b => b.onclick = () => {
      const e = ShopLabCore.ENDPOINTS[+b.dataset.ep];
      $('#api-method').value = e.method; $('#api-url').value = e.sample || e.path;
      $('#api-body').value = e.body ? JSON.stringify(e.body, null, 2) : '';
      $('#api-send').focus();
    });
    $('#api-format').onclick = () => { try { $('#api-body').value = JSON.stringify(JSON.parse($('#api-body').value), null, 2); } catch (e) { toast('The body is not valid JSON yet.', 'error'); } };
    const respTabs = [['resp-tab-body', 'api-response'], ['resp-tab-headers', 'api-response-headers']];
    respTabs.forEach(([t]) => $('#' + t).onclick = () => respTabs.forEach(([x, p]) => { const on = x === t; $('#' + x).setAttribute('aria-selected', String(on)); $('#' + p).hidden = !on; }));
    const build = () => {
      let headers = {};
      try { headers = JSON.parse($('#api-headers').value || '{}'); } catch (e) { toast('Extra headers must be valid JSON.', 'error'); return null; }
      return { method: $('#api-method').value, url: $('#api-url').value.trim(), headers, body: $('#api-body').value.trim() };
    };
    $('#api-curl').onclick = () => {
      const q = build(); if (!q) return;
      const url = /^https?:/.test(q.url) ? q.url : base + q.url;
      let c = `curl -i -X ${q.method} '${url}'`;
      if ($('#api-use-token').checked && S.token) c += ` \\\n  -H 'Authorization: Bearer ${S.token}'`;
      Object.keys(q.headers).forEach(k => { c += ` \\\n  -H '${k}: ${q.headers[k]}'`; });
      if (q.body && q.method !== 'GET') c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${q.body.replace(/'/g, "'\\''")}'`;
      const out = $('#api-curl-out'); out.hidden = false; out.textContent = c;
    };
    $('#api-send').onclick = async () => {
      const q = build(); if (!q) return;
      const btn = $('#api-send'); setBusy(btn, true, 'Sending…');
      const h = Object.assign({}, q.headers);
      const r = await request(q.method, q.url, { headers: h, rawBody: q.body && q.method !== 'GET' ? q.body : undefined, auth: $('#api-use-token').checked, silent401: true });
      setBusy(btn, false);
      const size = r.body == null ? 0 : new Blob([typeof r.body === 'string' ? r.body : JSON.stringify(r.body)]).size;
      $('#api-meta').innerHTML = `<span class="code-pill code-${String(r.status)[0]}" id="api-status" data-testid="api-status">${r.status}</span><span>${r.time} ms</span><span>${size} bytes</span>`;
      $('#api-response').textContent = r.body == null ? '(no body)' : typeof r.body === 'string' ? r.body : JSON.stringify(r.body, null, 2);
      $('#api-response-headers').textContent = Object.keys(r.headers).sort().map(k => `${k}: ${r.headers[k]}`).join('\n');
      if (/\/api\/auth\/login$/.test(q.url) && r.ok && r.body.token) toast('Login worked. Use the token in the Authorization header, or log in through the store to send it automatically.', 'info', 6000);
    };
  }

  // ---------------- boot ----------------
  async function init() {
    applyTheme(); renderModeStrip();
    if (S.token) {
      const r = await request('GET', '/api/auth/me', { silent401: true });
      if (r.ok) { S.user = r.body.user; S.session = r.body.session; } else setToken(null);
    }
    renderUserMenu(); await refreshCounts(); router();
  }
  init();
})();

</script>
</body>
</html>
