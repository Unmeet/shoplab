<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopLab | Practice store for test automation</title>
<meta name="description" content="A practice e-commerce store and REST API for learning UI and API test automation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F5FB; --surface: #FFFFFF; --surface-2: #EBEFF8; --ink: #17203A; --muted: #56617D; --line: #D9DFEC;
  --accent: #2B55E0; --accent-hover: #1F44BF; --accent-ink: #FFFFFF; --accent-soft: #E2E9FD;
  --tag: #F3B52F; --tag-ink: #3B2900; --ok: #16865F; --ok-soft: #DCF3E9; --bad: #C93636; --bad-soft: #FBE5E5; --warn-soft: #FFF3D6;
  --thumb-l1: 88%; --thumb-l2: 76%; --thumb-s1: 72%; --thumb-s2: 60%; --shadow: 0 1px 2px rgba(23, 32, 58, .06), 0 8px 24px rgba(23, 32, 58, .07);
  --radius-lg: 18px; --radius: 12px; --radius-sm: 8px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #161D31; --surface-2: #1E2740; --ink: #E7EBF5; --muted: #A2ACC6; --line: #2C3654;
    --accent: #6E8FFF; --accent-hover: #8AA4FF; --accent-ink: #0B1020; --accent-soft: #24305A;
    --tag: #F3B52F; --tag-ink: #2A1D00; --ok: #4BC795; --ok-soft: #173A2F; --bad: #FF7B7B; --bad-soft: #43202A; --warn-soft: #3A3018;
    --thumb-l1: 30%; --thumb-l2: 22%; --thumb-s1: 38%; --thumb-s2: 32%; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #161D31; --surface-2: #1E2740; --ink: #E7EBF5; --muted: #A2ACC6; --line: #2C3654;
  --accent: #6E8FFF; --accent-hover: #8AA4FF; --accent-ink: #0B1020; --accent-soft: #24305A;
  --tag: #F3B52F; --tag-ink: #2A1D00; --ok: #4BC795; --ok-soft: #173A2F; --bad: #FF7B7B; --bad-soft: #43202A; --warn-soft: #3A3018;
  --thumb-l1: 30%; --thumb-l2: 22%; --thumb-s1: 38%; --thumb-s2: 32%; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
img, svg { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0 0 .8em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; font: 600 .95rem/1 var(--font-body); padding: .72em 1.15em; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { background: transparent; color: var(--bad); border-color: currentColor; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.small { font-size: .85rem; padding: .55em .9em; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn .spin { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
label { font-weight: 600; font-size: .9rem; }
input:not([type]), input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="tel"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: .6em .75em; margin-top: .3em;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--bad); }
input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
.field { margin-bottom: 1rem; }
.field-error { color: var(--bad); font-size: .85rem; margin-top: .3em; min-height: 0; }
.field-error:empty { display: none; }
.check { display: flex; align-items: center; gap: .5em; font-weight: 500; margin: .35em 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1rem; }
.form-grid .full { grid-column: 1 / -1; }
.alert { padding: .8em 1em; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: .95rem; }
.alert.error { background: var(--bad-soft); color: var(--bad); }
.alert.success { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--accent-soft); color: var(--ink); }

/* header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding: .7rem 1.25rem; flex-wrap: wrap; }
.logo { font: 800 1.35rem/1 var(--font-display); color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: .4rem; letter-spacing: -.02em; }
.logo-mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--tag); border-radius: 10px 10px 10px 2px; font-size: 1.05rem; }
.search { flex: 1 1 280px; display: flex; position: relative; max-width: 520px; }
.search input { margin: 0; border-radius: 999px 0 0 999px; border-right: 0; }
.search button { border-radius: 0 999px 999px 0; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 .9rem var(--font-body); padding: 0 1rem; cursor: pointer; }
.suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); list-style: none; margin: 0; padding: .35rem; z-index: 30; }
.suggestions li { padding: .5rem .65rem; border-radius: var(--radius-sm); cursor: pointer; display: flex; gap: .6rem; align-items: center; }
.suggestions li[aria-selected="true"], .suggestions li:hover { background: var(--accent-soft); }
.suggestions .s-price { margin-left: auto; font-weight: 600; font-size: .9rem; }
.nav { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.nav > a, .nav .menu-trigger { color: var(--ink); text-decoration: none; font-weight: 600; font-size: .93rem; padding: .5rem .7rem; border-radius: 999px; display: inline-flex; align-items: center; gap: .35rem; background: none; border: 0; cursor: pointer; font-family: inherit; }
.nav > a:hover, .nav .menu-trigger:hover { background: var(--surface-2); }
.nav > a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: .75rem; font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.user-menu { position: relative; }
.dropdown { position: absolute; right: 0; top: calc(100% + 4px); min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: .35rem; display: none; z-index: 40; }
.user-menu:hover .dropdown, .user-menu:focus-within .dropdown, .user-menu.open .dropdown { display: block; }
.dropdown a, .dropdown button { display: block; width: 100%; text-align: left; padding: .55rem .7rem; border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; font-size: .93rem; cursor: pointer; }
.dropdown a:hover, .dropdown button:hover { background: var(--surface-2); }
.mode-strip { background: var(--warn-soft); font-size: .85rem; }
.mode-strip .inner { max-width: 1240px; margin: 0 auto; padding: .45rem 1.25rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.mode-strip.server { background: var(--ok-soft); }

main { max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; outline: none; }
.page-head { margin-bottom: 1.5rem; max-width: 760px; }
.page-head p { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.4rem; }
.crumbs { font-size: .88rem; margin-bottom: 1rem; color: var(--muted); }
.crumbs a { color: var(--muted); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 2rem; align-items: center; padding: 2rem; margin-bottom: 2rem; border-radius: 26px; background: var(--ink); color: var(--bg); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2rem, 4.4vw, 3.3rem); font-weight: 800; letter-spacing: -.03em; max-width: 14ch; }
.hero p { color: color-mix(in srgb, var(--bg) 78%, transparent); max-width: 52ch; }
.hero code { background: color-mix(in srgb, var(--bg) 16%, transparent); color: inherit; }
.hero .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 50%, transparent); }
.hero .btn.ghost:hover { background: color-mix(in srgb, var(--bg) 12%, transparent); }
.hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.2rem; }
.creds { background: var(--surface); color: var(--ink); border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; transform: rotate(1.2deg); box-shadow: 0 18px 40px rgba(0, 0, 0, .25); position: relative; }
.creds::before { content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; margin-left: -35px; background: var(--tag); opacity: .85; transform: rotate(-3deg); border-radius: 2px; }
.creds h2 { font-size: 1.05rem; margin-bottom: .6rem; }
.creds table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.creds td { padding: .32rem 0; border-top: 1px dashed var(--line); vertical-align: top; }
.creds td:first-child { padding-right: .8rem; white-space: nowrap; }
.creds code { font-size: .85rem; background: var(--surface-2); }
.creds .pw { margin: .7rem 0 0; font-size: .9rem; color: var(--ink); }

/* shop */
.shop { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1.75rem; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.filters summary { font: 650 1.1rem var(--font-display); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.filters summary::-webkit-details-marker { display: none; }
.filters fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
.filters legend { font-weight: 700; font-size: .9rem; margin-bottom: .35rem; padding: 0; }
.filters .count { margin-left: auto; color: var(--muted); font-size: .8rem; }
.range-row { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.results-head { display: flex; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.results-head h2 { margin: 0; }
.results-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.results-head label { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
.results-head select { width: auto; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .4rem .3rem .75rem; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: .85rem; border: 0; cursor: pointer; font-family: inherit; }
.chip span { font-weight: 700; padding: 0 .3rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 1.1rem; }
.product-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.thumb { display: grid; place-items: center; aspect-ratio: 4 / 3; background: linear-gradient(140deg, hsl(var(--h) var(--thumb-s1) var(--thumb-l1)), hsl(calc(var(--h) + 38) var(--thumb-s2) var(--thumb-l2))); text-decoration: none; }
.thumb span { font-size: 3.4rem; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .18)); }
.wish { position: absolute; top: .6rem; right: .6rem; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 1.1rem; box-shadow: var(--shadow); }
.wish.on { color: var(--bad); }
.pc-body { padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .2rem; flex: 1; }
.pc-cat { margin: 0; color: var(--muted); font-size: .8rem; }
.pc-name { margin: 0; font-size: 1rem; }
.pc-name a { color: var(--ink); text-decoration: none; }
.pc-name a:hover { text-decoration: underline; }
.rating { margin: 0; font-size: .85rem; }
.stars { color: var(--tag); letter-spacing: 1px; }
.stock { font-size: .8rem; font-weight: 600; }
.stock.in { color: var(--ok); } .stock.low { color: #C77700; } .stock.out { color: var(--bad); }
.pc-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: auto; padding-top: .6rem; }
.price-tag { display: inline-block; font: 700 1.05rem/1 var(--font-display); background: var(--tag); color: var(--tag-ink); padding: .38em .6em .38em .9em; border-radius: 4px 8px 8px 4px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
.price-tag.big { font-size: 1.6rem; padding: .35em .7em .35em 1.1em; clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); }
.pagination { display: flex; gap: .35rem; justify-content: center; margin-top: 1.6rem; flex-wrap: wrap; }
.pagination button { min-width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .9rem var(--font-body); cursor: pointer; padding: 0 .8rem; }
.pagination button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pagination button:disabled { opacity: .4; cursor: not-allowed; }
.skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); height: 300px; position: relative; overflow: hidden; }
.skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--surface-2), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.empty { text-align: center; padding: 3rem 1rem; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-lg); }
.empty .big { font-size: 2.5rem; }

/* product detail */
.pdp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.2rem; align-items: start; }
.pdp .thumb { border-radius: 24px; aspect-ratio: 1; }
.pdp .thumb span { font-size: 8rem; }
.pdp-info h1 { margin-bottom: .3rem; }
.opt-group { border: 0; padding: 0; margin: 1rem 0; }
.opt-group legend { font-weight: 700; font-size: .9rem; margin-bottom: .4rem; padding: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: .4rem; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: inline-block; padding: .45em .9em; border: 1.5px solid var(--line); border-radius: 999px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.swatches input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatches input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { width: 40px; height: 42px; border: 0; background: var(--surface-2); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.qty input { width: 56px; text-align: center; border: 0; margin: 0; border-radius: 0; padding: .5em 0; }
.buy-row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin: 1.2rem 0; }
.tabs { margin-top: 2.2rem; }
.tablist { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tablist button { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7rem 1rem; font: 600 .95rem var(--font-body); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tablist button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.spec { width: 100%; border-collapse: collapse; max-width: 560px; }
.spec th, .spec td { text-align: left; padding: .55rem .2rem; border-bottom: 1px solid var(--line); }
.spec th { width: 40%; color: var(--muted); font-weight: 600; }
.review { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.review p { margin: .2rem 0 0; }
.star-input { display: inline-flex; flex-direction: row-reverse; gap: .1rem; }
.star-input input { position: absolute; opacity: 0; }
.star-input label { font-size: 1.6rem; color: var(--line); cursor: pointer; font-weight: 400; }
.star-input input:checked ~ label, .star-input label:hover, .star-input label:hover ~ label { color: var(--tag); }
.star-input input:focus-visible + label { outline: 3px solid var(--accent); }

/* tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
table.data { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.data th, table.data td { padding: .75rem .9rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data th { font-size: .82rem; color: var(--muted); background: var(--surface-2); font-weight: 700; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data th button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
table.data input { margin: 0; max-width: 110px; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.status { display: inline-block; padding: .2em .65em; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--surface-2); }
.status.placed { background: var(--accent-soft); color: var(--accent); }
.status.processing { background: var(--warn-soft); color: #A86500; }
.status.shipped { background: #E5DEFD; color: #5B3FC4; }
.status.delivered { background: var(--ok-soft); color: var(--ok); }
.status.cancelled { background: var(--bad-soft); color: var(--bad); }

/* cart and checkout */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.75rem; align-items: start; }
.cart-line { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.cart-line:last-child { border-bottom: 0; }
.cart-line .thumb { border-radius: var(--radius); width: 72px; aspect-ratio: 1; }
.cart-line .thumb span { font-size: 2rem; }
.cart-line h3 { margin: 0; }
.cart-line select { width: auto; margin: 0; }
.summary dl { display: grid; grid-template-columns: 1fr auto; gap: .5rem 0; margin: 0 0 1rem; }
.summary dd { margin: 0; padding-left: 1rem; text-align: right; font-variant-numeric: tabular-nums; }
.summary .total { font: 700 1.25rem var(--font-display); padding-top: .6rem; border-top: 1px solid var(--line); }
.coupon-row { display: flex; gap: .5rem; align-items: end; }
.coupon-row input { margin: 0; text-transform: uppercase; }
.steps { display: flex; gap: .4rem; list-style: none; padding: 0; margin: 0 0 1.5rem; counter-reset: step; flex-wrap: wrap; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: .5rem; padding: .45rem .9rem .45rem .45rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .9rem; color: var(--muted); }

  function round(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  function rid(n) { const c = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (let i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
  function isInt(v) { return typeof v === 'number' && Number.isInteger(v); }

  function luhn(num) {
    let sum = 0, alt = false;
    for (let i = num.length - 1; i >= 0; i--) { let d = +num[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; }
    return sum % 10 === 0;
  }

  function createBackend(opts) {
    opts = opts || {};
    const started = Date.now();
    let db = null;
    try { db = opts.load ? opts.load() : null; } catch (e) { db = null; }
    if (!db || db.version !== 1) db = seed();
    const hits = {};

    function save() { if (opts.save) { try { opts.save(db); } catch (e) { /* storage full or blocked */ } } }
    function ok(status, body, headers) { return { status, body, headers: headers || {} }; }
    function err(status, code, message, details) {
      const e = { code, message };
      if (details && details.length) e.details = details;
      return { status, body: { error: e }, headers: {} };
    }
    function publicUser(u) { const c = clone(u); delete c.password; return c; }
    function findProduct(id) { return db.products.find(p => p.id === id); }
    function parseId(v) { return /^\d+$/.test(String(v)) ? parseInt(v, 10) : NaN; }

    function authenticate(headers) {
      const h = headers.authorization || '';
      if (!h) return { error: err(401, 'AUTH_REQUIRED', 'This endpoint needs a Bearer token. Log in with POST /api/auth/login.') };
      const m = /^Bearer\s+(\S+)$/i.exec(h);
      if (!m) return { error: err(401, 'MALFORMED_AUTH_HEADER', 'Use the format: Authorization: Bearer <token>.') };
      const s = db.sessions[m[1]];
      if (!s) return { error: err(401, 'INVALID_TOKEN', 'The token is not recognised. Log in again.') };
      if (s.expiresAt < Date.now()) { delete db.sessions[m[1]]; return { error: err(401, 'TOKEN_EXPIRED', 'The token has expired. Log in again.') }; }
      const user = db.users.find(u => u.id === s.userId);
      if (!user) return { error: err(401, 'INVALID_TOKEN', 'The user for this token no longer exists.') };
      return { user, token: m[1], session: s };
    }

    function createSession(user, ttl) {
      const token = 'sl_' + rid(32);
      const expiresAt = Date.now() + ttl * 1000;
      db.sessions[token] = { userId: user.id, expiresAt };
      return { token, expiresIn: ttl, expiresAt: new Date(expiresAt).toISOString() };
    }

    function getCart(userId) {
      if (!db.carts[userId]) db.carts[userId] = { items: [], coupon: null, shippingMethod: 'standard' };
      const c = db.carts[userId];
      c.items = c.items.filter(i => findProduct(i.productId));
      return c;
    }

    function cartView(userId) {
      const c = getCart(userId);
      const items = c.items.map(i => {
        const p = findProduct(i.productId);
        return { productId: p.id, name: p.name, sku: p.sku, emoji: p.emoji, hue: p.hue, price: p.price, quantity: i.quantity, stock: p.stock, lineTotal: round(p.price * i.quantity) };
      });
      const subtotal = round(items.reduce((s, i) => s + i.lineTotal, 0));
      let discount = 0, couponNote = null;
      const coupon = c.coupon ? COUPONS[c.coupon] : null;
      if (coupon) {
        if (coupon.type === 'percent') discount = round(subtotal * coupon.value / 100);
        if (coupon.type === 'flat') {
          if (subtotal >= coupon.minSubtotal) discount = Math.min(coupon.value, subtotal);
          else couponNote = 'Add ' + round(coupon.minSubtotal - subtotal).toFixed(2) + ' more to use FLAT20.';
        }
      }
      const m = SHIPPING[c.shippingMethod] || SHIPPING.standard;
      let shipping = items.length ? m.price : 0;
      if (m.freeOver && subtotal >= m.freeOver) shipping = 0;
      if (coupon && coupon.type === 'shipping') shipping = 0;
      const tax = round(Math.max(0, subtotal - discount) * TAX_RATE);
      const total = round(Math.max(0, subtotal - discount) + shipping + tax);
      return {
        items, itemCount: items.reduce((s, i) => s + i.quantity, 0),
        coupon: coupon ? { code: coupon.code, description: coupon.description, note: couponNote } : null,
        shippingMethod: m.id, subtotal, discount: round(discount), shipping: round(shipping), taxRate: TAX_RATE, tax, total, currency: 'USD'
      };
    }

    function orderStatus(o) {
      if (o.cancelledAt) return 'cancelled';
      const mins = (Date.now() - Date.parse(o.createdAt)) / 60000;
      if (mins < 2) return 'placed';
      if (mins < 5) return 'processing';
      if (mins < 10) return 'shipped';
      return 'delivered';
    }
    function orderView(o) { const c = clone(o); c.status = orderStatus(o); return c; }

    function validateProduct(b, partial) {
      const d = [];
      const has = k => b[k] !== undefined;
      if (!partial || has('name')) { if (str(b.name).length < 2 || str(b.name).length > 80) d.push({ field: 'name', message: 'Name must be 2–80 characters.' }); }
      if (!partial || has('category')) { if (!CATEGORIES.some(c => c.id === b.category)) d.push({ field: 'category', message: 'Category must be one of: ' + CATEGORIES.map(c => c.id).join(', ') + '.' }); }
      if (!partial || has('price')) { if (typeof b.price !== 'number' || !(b.price > 0) || b.price > 100000) d.push({ field: 'price', message: 'Price must be a number greater than 0.' }); }
      if (!partial || has('stock')) { if (!isInt(b.stock) || b.stock < 0) d.push({ field: 'stock', message: 'Stock must be a whole number of 0 or more.' }); }
      if (has('description') && typeof b.description !== 'string') d.push({ field: 'description', message: 'Description must be a string.' });
      return d;
    }

    const routes = [];
    function route(method, pattern, auth, fn) {
      const keys = [];
      const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
      routes.push({ method, re, keys, auth, fn });
    }

    // ---------- utilities ----------
    route('GET', '/api/health', null, () => ok(200, { status: 'ok', mode: opts.mode || 'mock', version: '1.0.0', time: new Date().toISOString(), uptimeSeconds: Math.round((Date.now() - started) / 1000) }));

      Object.keys(sessions).forEach(t => { if (db.users.some(u => u.id === sessions[t].userId)) db.sessions[t] = sessions[t]; });
      return ok(200, { message: 'All data is back to the original seed.' });

    route('GET', '/api/delay/:seconds', null, c => {

      const now = Date.now();

      const reset = hits[key].length ? Math.ceil((hits[key][0] + 60000 - now) / 1000) : 60;
      const headers = { 'x-ratelimit-limit': '5', 'x-ratelimit-reset': String(reset) };

        r.headers = Object.assign(headers, { 'x-ratelimit-remaining': '0', 'retry-after': String(reset) });

      }
      hits[key].push(now);
      headers['x-ratelimit-remaining'] = String(5 - hits[key].length);
      return ok(200, { message: 'Request accepted.', remaining: 5 - hits[key].length }, headers);

    route('POST', '/api/upload', null, c => ok(201, { message: 'Upload received.', receivedBytes: c.req.rawLength || 0, contentType: c.headers['content-type'] || null, fileName: c.headers['x-file-name'] || null }));
    route('GET', '/api/files/sample.csv', null, () => {
      const rows = ['id,name,category,price,stock'].concat(db.products.map(p => [p.id, '"' + p.name.replace(/"/g, '""') + '"', p.category, p.price.toFixed(2), p.stock].join(',')));
      return { status: 200, raw: true, body: rows.join('\n') + '\n', headers: { 'content-type': 'text/csv; charset=utf-8', 'content-disposition': 'attachment; filename="shoplab-products.csv"' } };
    });

    // ---------- auth ----------
    route('POST', '/api/auth/register', null, c => {
      const b = c.body, d = [];
      if (!/^[A-Za-z0-9_]{3,20}$/.test(str(b.username))) d.push({ field: 'username', message: 'Username must be 3–20 letters, numbers or underscores.' });
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str(b.email))) d.push({ field: 'email', message: 'Enter a valid email address.' });
      const pw = typeof b.password === 'string' ? b.password : '';
      if (pw.length < 8 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) d.push({ field: 'password', message: 'Password needs 8+ characters with upper and lower case, a number and a symbol.' });
      if (!str(b.firstName)) d.push({ field: 'firstName', message: 'First name is required.' });
      if (!str(b.lastName)) d.push({ field: 'lastName', message: 'Last name is required.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      if (db.users.some(u => u.username.toLowerCase() === str(b.username).toLowerCase())) return err(409, 'USERNAME_TAKEN', 'That username is already registered.', [{ field: 'username', message: 'Choose a different username.' }]);
      if (db.users.some(u => u.email.toLowerCase() === str(b.email).toLowerCase())) return err(409, 'EMAIL_TAKEN', 'That email is already registered.', [{ field: 'email', message: 'Use a different email or log in.' }]);
      const user = { id: db.seq.user++, username: str(b.username), email: str(b.email), firstName: str(b.firstName), lastName: str(b.lastName), role: 'customer', status: 'active', phone: str(b.phone), password: pw, createdAt: new Date().toISOString() };
      db.users.push(user);

      return ok(201, Object.assign({ user: publicUser(user) }, s), { location: '/api/users/' + user.id });

    route('POST', '/api/auth/login', null, c => {
      const b = c.body, d = [];
      if (!str(b.username)) d.push({ field: 'username', message: 'Username is required.' });
      if (!b.password) d.push({ field: 'password', message: 'Password is required.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Username and password are required.', d);

      if (b.expiresIn !== undefined) {
        if (!isInt(b.expiresIn) || b.expiresIn < 10 || b.expiresIn > 86400) return err(400, 'VALIDATION_ERROR', 'expiresIn must be a whole number of seconds from 10 to 86400.', [{ field: 'expiresIn', message: 'Use 10–86400.' }]);

    });
    route('GET', '/api/auth/me', 'user', c => ok(200, { user: publicUser(c.user), session: { expiresAt: new Date(c.session.expiresAt).toISOString() } }));
    route('PATCH', '/api/auth/me', 'user', c => {
      const b = c.body, d = [];
      ['firstName', 'lastName'].forEach(k => { if (b[k] !== undefined && !str(b[k])) d.push({ field: k, message: 'Cannot be empty.' }); });
      if (b.email !== undefined) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str(b.email))) d.push({ field: 'email', message: 'Enter a valid email address.' });
        else if (db.users.some(u => u.id !== c.user.id && u.email.toLowerCase() === str(b.email).toLowerCase())) return err(409, 'EMAIL_TAKEN', 'That email belongs to another account.', [{ field: 'email', message: 'Use a different email.' }]);
      }
      if (b.phone !== undefined && !/^[+\d][\d\s-]{6,19}$/.test(str(b.phone))) d.push({ field: 'phone', message: 'Enter a phone number with 7–20 digits.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      ['firstName', 'lastName', 'email', 'phone'].forEach(k => { if (b[k] !== undefined) c.user[k] = str(b[k]); });
      return ok(200, { user: publicUser(c.user) });
    });
    route('POST', '/api/auth/logout', 'user', c => { delete db.sessions[c.token]; return ok(200, { message: 'Logged out.' }); });

    // ---------- catalog ----------
    route('GET', '/api/categories', null, () => ok(200, { data: CATEGORIES.map(cat => Object.assign({}, cat, { productCount: db.products.filter(p => p.category === cat.id).length })) }));
    route('GET', '/api/products', null, c => {
      const q = c.query;
      let list = db.products.slice();
      const num = (k) => { if (q[k] === undefined || q[k] === '') return undefined; const n = Number(q[k]); return isNaN(n) ? NaN : n; };
      const minPrice = num('minPrice'), maxPrice = num('maxPrice'), minRating = num('minRating');
      const bad = [];
      if (Number.isNaN(minPrice)) bad.push({ field: 'minPrice', message: 'Must be a number.' });
      if (Number.isNaN(maxPrice)) bad.push({ field: 'maxPrice', message: 'Must be a number.' });
      if (Number.isNaN(minRating)) bad.push({ field: 'minRating', message: 'Must be a number.' });
      const page = q.page === undefined ? 1 : Number(q.page);
      const limit = q.limit === undefined ? 12 : Number(q.limit);
      if (!Number.isInteger(page) || page < 1) bad.push({ field: 'page', message: 'Page must be a whole number of 1 or more.' });
      if (!Number.isInteger(limit) || limit < 1 || limit > 50) bad.push({ field: 'limit', message: 'Limit must be a whole number from 1 to 50.' });
      const sorts = { featured: (a, b) => a.id - b.id, newest: (a, b) => b.id - a.id, price_asc: (a, b) => a.price - b.price, price_desc: (a, b) => b.price - a.price, rating: (a, b) => b.rating - a.rating || a.id - b.id, name_asc: (a, b) => a.name.localeCompare(b.name), name_desc: (a, b) => b.name.localeCompare(a.name) };
      const sort = q.sort || 'featured';
      if (!sorts[sort]) bad.push({ field: 'sort', message: 'Sort must be one of: ' + Object.keys(sorts).join(', ') + '.' });
      if (bad.length) return err(400, 'INVALID_QUERY', 'Some query parameters are invalid.', bad);
      if (q.search) { const s = String(q.search).toLowerCase().trim(); list = list.filter(p => (p.name + ' ' + p.description + ' ' + p.category + ' ' + p.sku).toLowerCase().includes(s)); }
      if (q.category) { const cats = String(q.category).split(',').filter(Boolean); list = list.filter(p => cats.includes(p.category)); }
      if (minPrice !== undefined) list = list.filter(p => p.price >= minPrice);
      if (maxPrice !== undefined) list = list.filter(p => p.price <= maxPrice);
      if (minRating !== undefined) list = list.filter(p => p.rating >= minRating);
      if (q.inStock === 'true') list = list.filter(p => p.stock > 0);
      list.sort(sorts[sort]);
      const total = list.length;
      return ok(200, { data: list.slice((page - 1) * limit, page * limit), meta: { page, limit, total, totalPages: Math.max(1, Math.ceil(total / limit)), sort } });
    });
    route('GET', '/api/products/:id', null, c => {
      const id = parseId(c.params.id);
      if (isNaN(id)) return err(400, 'INVALID_ID', 'Product id must be a number.');
      const p = findProduct(id);
      return p ? ok(200, p) : err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + id + '.');
    });
    route('POST', '/api/products', 'admin', c => {
      const d = validateProduct(c.body, false);
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      const b = c.body, id = db.seq.product++;
      const p = { id, sku: 'SL-' + (1000 + id), name: str(b.name), category: b.category, price: round(b.price), rating: 0, ratingsCount: 0, stock: b.stock, emoji: str(b.emoji) || '📦', hue: isInt(b.hue) ? b.hue : 260, description: str(b.description), colors: Array.isArray(b.colors) ? b.colors : [], sizes: Array.isArray(b.sizes) ? b.sizes : [], createdAt: new Date().toISOString() };
      db.products.push(p);
      return ok(201, p, { location: '/api/products/' + id });
    });
    function updateProduct(c, partial) {
      const id = parseId(c.params.id);
      if (isNaN(id)) return err(400, 'INVALID_ID', 'Product id must be a number.');
      const p = findProduct(id);
      if (!p) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + id + '.');
      const d = validateProduct(c.body, partial);
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      const b = c.body;
      ['name', 'description', 'emoji'].forEach(k => { if (b[k] !== undefined) p[k] = str(b[k]); else if (!partial && k === 'description') p[k] = ''; });
      ['category', 'stock', 'colors', 'sizes', 'hue'].forEach(k => { if (b[k] !== undefined) p[k] = b[k]; });
      if (b.price !== undefined) p.price = round(b.price);
      return ok(200, p);
    }
    route('PUT', '/api/products/:id', 'admin', c => updateProduct(c, false));
    route('PATCH', '/api/products/:id', 'admin', c => updateProduct(c, true));
    route('DELETE', '/api/products/:id', 'admin', c => {
      const id = parseId(c.params.id);
      if (isNaN(id)) return err(400, 'INVALID_ID', 'Product id must be a number.');
      const i = db.products.findIndex(p => p.id === id);
      if (i < 0) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + id + '.');
      db.products.splice(i, 1);
      Object.keys(db.wishlists).forEach(u => { db.wishlists[u] = db.wishlists[u].filter(x => x !== id); });
      return ok(204, null);
    });
    route('GET', '/api/products/:id/reviews', null, c => {
      const id = parseId(c.params.id);
      if (!findProduct(id)) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + c.params.id + '.');
      return ok(200, { data: db.reviews.filter(r => r.productId === id).sort((a, b) => b.createdAt.localeCompare(a.createdAt)) });
    });
    route('POST', '/api/products/:id/reviews', 'user', c => {
      const id = parseId(c.params.id), p = findProduct(id);
      if (!p) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + c.params.id + '.');
      const d = [];
      if (!isInt(c.body.rating) || c.body.rating < 1 || c.body.rating > 5) d.push({ field: 'rating', message: 'Rating must be a whole number from 1 to 5.' });
      const text = str(c.body.comment);
      if (text.length < 5 || text.length > 500) d.push({ field: 'comment', message: 'Comment must be 5–500 characters.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'Some fields are invalid.', d);
      if (db.reviews.some(r => r.productId === id && r.userId === c.user.id)) return err(409, 'ALREADY_REVIEWED', 'You have already reviewed this product.');
      const r = { id: db.seq.review++, productId: id, userId: c.user.id, author: c.user.firstName + ' ' + c.user.lastName.charAt(0) + '.', rating: c.body.rating, comment: text, createdAt: new Date().toISOString() };
      db.reviews.push(r);
      p.rating = Math.round(((p.rating * p.ratingsCount) + r.rating) / (p.ratingsCount + 1) * 10) / 10;
      p.ratingsCount += 1;
      return ok(201, r);
    });

    // ---------- cart ----------
    route('GET', '/api/coupons', null, () => ok(200, { data: Object.values(COUPONS).map(x => ({ code: x.code, description: x.description, expired: !!x.expired })) }));
    route('GET', '/api/shipping-methods', null, () => ok(200, { data: Object.values(SHIPPING) }));
    route('GET', '/api/cart', 'user', c => ok(200, cartView(c.user.id)));
    route('POST', '/api/cart/items', 'user', c => {
      const b = c.body;
      const qty = b.quantity === undefined ? 1 : b.quantity;
      if (!isInt(b.productId)) return err(400, 'VALIDATION_ERROR', 'productId must be a number.', [{ field: 'productId', message: 'Required number.' }]);
      if (!isInt(qty) || qty < 1 || qty > 10) return err(400, 'VALIDATION_ERROR', 'Quantity must be a whole number from 1 to 10.', [{ field: 'quantity', message: 'Use 1–10.' }]);
      const p = findProduct(b.productId);
      if (!p) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + b.productId + '.');
      if (p.stock === 0) return err(409, 'OUT_OF_STOCK', p.name + ' is out of stock.');
      const cart = getCart(c.user.id);
      const line = cart.items.find(i => i.productId === p.id);
      const next = (line ? line.quantity : 0) + qty;
      if (next > 10) return err(409, 'QUANTITY_LIMIT', 'You can buy at most 10 of one item.');
      if (next > p.stock) return err(409, 'INSUFFICIENT_STOCK', 'Only ' + p.stock + ' of ' + p.name + ' left.');
      if (line) line.quantity = next; else cart.items.push({ productId: p.id, quantity: qty });
      return ok(201, cartView(c.user.id));
    });
    route('PATCH', '/api/cart/items/:productId', 'user', c => {
      const id = parseId(c.params.productId), cart = getCart(c.user.id);
      const line = cart.items.find(i => i.productId === id);
      if (!line) return err(404, 'ITEM_NOT_IN_CART', 'Product ' + c.params.productId + ' is not in your cart.');
      const q = c.body.quantity;
      if (!isInt(q) || q < 0 || q > 10) return err(400, 'VALIDATION_ERROR', 'Quantity must be a whole number from 0 to 10.', [{ field: 'quantity', message: 'Use 0–10.' }]);
      const p = findProduct(id);
      if (q > p.stock) return err(409, 'INSUFFICIENT_STOCK', 'Only ' + p.stock + ' of ' + p.name + ' left.');
      if (q === 0) cart.items = cart.items.filter(i => i !== line); else line.quantity = q;
      return ok(200, cartView(c.user.id));
    });
    route('DELETE', '/api/cart/items/:productId', 'user', c => {
      const id = parseId(c.params.productId), cart = getCart(c.user.id);
      if (!cart.items.some(i => i.productId === id)) return err(404, 'ITEM_NOT_IN_CART', 'Product ' + c.params.productId + ' is not in your cart.');
      cart.items = cart.items.filter(i => i.productId !== id);
      return ok(200, cartView(c.user.id));
    });
    route('DELETE', '/api/cart', 'user', c => { const cart = getCart(c.user.id); cart.items = []; cart.coupon = null; return ok(200, cartView(c.user.id)); });
    route('POST', '/api/cart/coupon', 'user', c => {
      const code = str(c.body.code).toUpperCase();
      if (!code) return err(400, 'VALIDATION_ERROR', 'Enter a coupon code.', [{ field: 'code', message: 'Required.' }]);
      const cp = COUPONS[code];
      if (!cp) return err(404, 'INVALID_COUPON', 'Coupon ' + code + ' does not exist.');
      if (cp.expired) return err(400, 'COUPON_EXPIRED', 'Coupon ' + code + ' has expired.');
      const view = cartView(c.user.id);
      if (!view.items.length) return err(400, 'CART_EMPTY', 'Add items before applying a coupon.');
      if (cp.minSubtotal && view.subtotal < cp.minSubtotal) return err(400, 'COUPON_MIN_NOT_MET', code + ' needs a subtotal of at least $' + cp.minSubtotal + '.');
      getCart(c.user.id).coupon = code;
      return ok(200, cartView(c.user.id));
    });
    route('DELETE', '/api/cart/coupon', 'user', c => { getCart(c.user.id).coupon = null; return ok(200, cartView(c.user.id)); });
    route('PUT', '/api/cart/shipping', 'user', c => {
      const m = str(c.body.method);
      if (!SHIPPING[m]) return err(400, 'VALIDATION_ERROR', 'Method must be standard, express or overnight.', [{ field: 'method', message: 'Unknown method.' }]);
      getCart(c.user.id).shippingMethod = m;
      return ok(200, cartView(c.user.id));
    });

    // ---------- wishlist ----------
    route('GET', '/api/wishlist', 'user', c => ok(200, { data: (db.wishlists[c.user.id] || []).map(findProduct).filter(Boolean) }));
    route('POST', '/api/wishlist', 'user', c => {
      const id = c.body.productId;
      if (!isInt(id)) return err(400, 'VALIDATION_ERROR', 'productId must be a number.', [{ field: 'productId', message: 'Required number.' }]);
      if (!findProduct(id)) return err(404, 'PRODUCT_NOT_FOUND', 'No product has id ' + id + '.');
      const w = db.wishlists[c.user.id] = db.wishlists[c.user.id] || [];
      if (w.includes(id)) return err(409, 'ALREADY_IN_WISHLIST', 'That product is already in your wishlist.');
      w.push(id);
      return ok(201, { data: w.map(findProduct).filter(Boolean) });
    });
    route('DELETE', '/api/wishlist/:productId', 'user', c => {
      const id = parseId(c.params.productId), w = db.wishlists[c.user.id] || [];
      if (!w.includes(id)) return err(404, 'NOT_IN_WISHLIST', 'Product ' + c.params.productId + ' is not in your wishlist.');
      db.wishlists[c.user.id] = w.filter(x => x !== id);
      return ok(204, null);
    });

    // ---------- orders ----------
    route('POST', '/api/orders', 'user', c => {
      const view = cartView(c.user.id);
      if (!view.items.length) return err(400, 'CART_EMPTY', 'Your cart is empty.');
      if (c.user.username === 'error_user') return err(500, 'PAYMENT_SERVICE_UNAVAILABLE', 'The payment service failed. This user always fails at checkout.');
      const a = c.body.shippingAddress || {}, pay = c.body.payment || {}, d = [];
      if (str(a.fullName).length < 2) d.push({ field: 'shippingAddress.fullName', message: 'Enter the recipient’s full name.' });
      if (!/^[+\d][\d\s-]{6,19}$/.test(str(a.phone))) d.push({ field: 'shippingAddress.phone', message: 'Enter a phone number with 7–20 digits.' });
      if (str(a.line1).length < 3) d.push({ field: 'shippingAddress.line1', message: 'Enter a street address.' });
      if (!str(a.city)) d.push({ field: 'shippingAddress.city', message: 'Enter a city.' });
      if (!str(a.state)) d.push({ field: 'shippingAddress.state', message: 'Enter a state or region.' });
      if (!/^[A-Za-z0-9][A-Za-z0-9 -]{2,9}$/.test(str(a.zip))) d.push({ field: 'shippingAddress.zip', message: 'Enter a postal code of 3–10 characters.' });
      if (!/^[A-Z]{2}$/.test(str(a.country))) d.push({ field: 'shippingAddress.country', message: 'Use a 2-letter country code like US or IN.' });
      if (d.length) return err(400, 'VALIDATION_ERROR', 'The shipping address has errors.', d);
      const num = String(pay.cardNumber || '').replace(/[\s-]/g, '');
      const pd = [];
      if (str(pay.cardName).length < 2) pd.push({ field: 'payment.cardName', message: 'Enter the name on the card.' });
      if (!/^\d{13,19}$/.test(num) || !luhn(num)) pd.push({ field: 'payment.cardNumber', message: 'Card number is not valid.' });
      const em = /^(0[1-9]|1[0-2])\/(\d{2})$/.exec(str(pay.expiry));
      if (!em) pd.push({ field: 'payment.expiry', message: 'Use MM/YY.' });
      else { const now = new Date(); const y = 2000 + +em[2], mo = +em[1]; if (y < now.getFullYear() || (y === now.getFullYear() && mo < now.getMonth() + 1)) pd.push({ field: 'payment.expiry', message: 'This card has expired.' }); }
      if (!/^\d{3,4}$/.test(str(pay.cvv))) pd.push({ field: 'payment.cvv', message: 'CVV is 3 or 4 digits.' });
      if (pd.length) return err(422, 'PAYMENT_INVALID', 'The payment details are not valid.', pd);
      if (num === '4000000000000002') return err(402, 'PAYMENT_DECLINED', 'The card was declined. Use 4111 1111 1111 1111 to succeed.');
      for (const i of view.items) { const p = findProduct(i.productId); if (i.quantity > p.stock) return err(409, 'INSUFFICIENT_STOCK', 'Only ' + p.stock + ' of ' + p.name + ' left.'); }
      view.items.forEach(i => { findProduct(i.productId).stock -= i.quantity; });
      const brand = num[0] === '4' ? 'Visa' : num[0] === '5' ? 'Mastercard' : num[0] === '3' ? 'Amex' : 'Card';
      const order = {
        id: db.seq.order++, userId: c.user.id, items: view.items, subtotal: view.subtotal, discount: view.discount, shipping: view.shipping, tax: view.tax, total: view.total,
        coupon: view.coupon ? view.coupon.code : null, shippingMethod: view.shippingMethod,
        shippingAddress: { fullName: str(a.fullName), phone: str(a.phone), line1: str(a.line1), line2: str(a.line2), city: str(a.city), state: str(a.state), zip: str(a.zip), country: str(a.country) },
        payment: { brand, last4: num.slice(-4) }, createdAt: new Date().toISOString(), cancelledAt: null
      };
      db.orders.push(order);
      const cart = getCart(c.user.id); cart.items = []; cart.coupon = null;
      return ok(201, orderView(order), { location: '/api/orders/' + order.id });
    });
    route('GET', '/api/orders', 'user', c => {
      let list = db.orders.filter(o => c.user.role === 'admin' || o.userId === c.user.id).map(orderView);
      if (c.query.status) list = list.filter(o => o.status === c.query.status);
      const s = c.query.sort || 'newest';
      const sorts = { newest: (a, b) => b.id - a.id, oldest: (a, b) => a.id - b.id, total_desc: (a, b) => b.total - a.total };
      if (!sorts[s]) return err(400, 'INVALID_QUERY', 'Sort must be newest, oldest or total_desc.');
      list.sort(sorts[s]);
      return ok(200, { data: list, meta: { total: list.length } });
    });
    function ownOrder(c) {
      const id = parseId(c.params.id);
      if (isNaN(id)) return { error: err(400, 'INVALID_ID', 'Order id must be a number.') };
      const o = db.orders.find(x => x.id === id);
      if (!o) return { error: err(404, 'ORDER_NOT_FOUND', 'No order has id ' + id + '.') };
      if (o.userId !== c.user.id && c.user.role !== 'admin') return { error: err(403, 'FORBIDDEN', 'That order belongs to another user.') };
      return { order: o };
    }
    route('GET', '/api/orders/:id', 'user', c => { const r = ownOrder(c); return r.error || ok(200, orderView(r.order)); });
    route('POST', '/api/orders/:id/cancel', 'user', c => {
      const r = ownOrder(c); if (r.error) return r.error;
      const st = orderStatus(r.order);
      if (st !== 'placed' && st !== 'processing') return err(409, 'ORDER_NOT_CANCELLABLE', 'Orders that are ' + st + ' cannot be cancelled.');
      r.order.cancelledAt = new Date().toISOString();
      r.order.items.forEach(i => { const p = findProduct(i.productId); if (p) p.stock += i.quantity; });
      return ok(200, orderView(r.order));
    });

    // ---------- users ----------
    route('GET', '/api/users', 'admin', () => ok(200, { data: db.users.map(publicUser) }));
    route('GET', '/api/users/:id', 'admin', c => { const u = db.users.find(x => x.id === parseId(c.params.id)); return u ? ok(200, publicUser(u)) : err(404, 'USER_NOT_FOUND', 'No user has id ' + c.params.id + '.'); });

    function handle(req) {
      const method = String(req.method || 'GET').toUpperCase();
      const path = (String(req.path || '/').replace(/\/+$/, '')) || '/';
      const headers = {};
      Object.keys(req.headers || {}).forEach(k => { headers[k.toLowerCase()] = String(req.headers[k]); });
      let res = null;
      try {
        if (method === 'OPTIONS') res = ok(204, null);
        else if (req.bodyError) res = err(400, 'MALFORMED_JSON', 'The request body is not valid JSON.');
        else {
          let match = null, pathHit = false;
          for (const r of routes) {
            const m = r.re.exec(path);
            if (!m) continue;
            pathHit = true;
            if (r.method !== method) continue;
            const params = {}; r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
            match = { r, params }; break;
          }
          if (!match) res = pathHit ? err(405, 'METHOD_NOT_ALLOWED', method + ' is not supported on ' + path + '.') : err(404, 'ROUTE_NOT_FOUND', 'No endpoint matches ' + method + ' ' + path + '.');
          else {
            const body = req.body && typeof req.body === 'object' && !Array.isArray(req.body) ? req.body : {};
            const ctx = { req, method, path, params: match.params, query: req.query || {}, headers, body, rawBody: req.body };
            if (match.r.auth) {
              const a = authenticate(headers);
              if (a.error) res = a.error;
              else {
                ctx.user = a.user; ctx.token = a.token; ctx.session = a.session;
                if (match.r.auth === 'admin' && a.user.role !== 'admin') res = err(403, 'FORBIDDEN', 'This endpoint is for admin users only.');
              }
            }
            if (!res) res = match.r.fn(ctx);
          }
        }
      } catch (e) {
        res = err(500, 'INTERNAL_ERROR', 'Unexpected server error: ' + e.message);
      }
      res.headers = Object.assign({ 'x-request-id': 'req_' + rid(12), 'x-powered-by': 'ShopLab' }, res.headers || {});
      if (res.body !== null && res.body !== undefined && !res.raw) res.headers['content-type'] = 'application/json; charset=utf-8';
      res.delay = res.delay || 0;
      if (method !== 'GET' || path === '/api/auth/me') save();
      return res;
    }

    return { handle, reset: () => { db = seed(); save(); } };
  }

  return { createBackend, seed, PASSWORD, TEST_USERS, ENDPOINTS, CATEGORIES, SHIPPING, COUPONS };
})();

    $('#reset-table').onclick = () => { employees = seedEmployees(); Object.assign(T, { q: '', sort: null, dir: 1, page: 1 }); $('#table-search').value = ''; paintTable(); };
    paintTable();

    // progress
    let pv = 0, piv = null;
    const pPaint = () => { const bar = $('#progress-bar'); bar.style.width = pv + '%'; bar.textContent = pv + '%'; bar.classList.toggle('complete', pv >= 100); $('#progress').setAttribute('aria-valuenow', pv); };
    $('#progress-start').onclick = () => { if (piv || pv >= 100) return; set('progress-result', 'Running…'); piv = every(() => { pv++; pPaint(); if (pv >= 100) { clearInterval(piv); piv = null; set('progress-result', 'Complete.'); } }, 80); };
    $('#progress-stop').onclick = () => { if (!piv) return; clearInterval(piv); piv = null; set('progress-result', `Stopped at ${pv}%. ${Math.abs(pv - 75) <= 2 ? 'Within 2% of the target.' : `That is ${Math.abs(pv - 75)}% from 75%.`}`); };
    $('#progress-reset').onclick = () => { if (piv) { clearInterval(piv); piv = null; } pv = 0; pPaint(); set('progress-result', 'Not started.'); };

    // infinite scroll
    let loaded = 0, loading = false;
    const sb = $('#scroll-box');
    const more = () => {
      if (loading || loaded >= 100) return; loading = true; set('scroll-loader', 'Loading…');
      later(() => { const items = Array.from({ length: 20 }, (_, i) => `<div class="item" id="feed-item-${loaded + i + 1}" data-testid="feed-item">Feed item ${loaded + i + 1}</div>`).join(''); $('#scroll-items').insertAdjacentHTML('beforeend', items); loaded += 20; set('scroll-count', loaded); loading = false; set('scroll-loader', loaded >= 100 ? 'You have reached the end.' : 'Scroll for more'); }, 600);
    };
    sb.addEventListener('scroll', () => { if (sb.scrollTop + sb.clientHeight >= sb.scrollHeight - 30) more(); });
    more();

    // broken
    $('#check-images').onclick = () => { const imgs = $$('#lab-broken img'); const broken = imgs.filter(i => !i.complete || i.naturalWidth === 0); set('images-result', `${broken.length} of ${imgs.length} images are broken: ${broken.map(i => i.id).join(', ')}.`); };

    // modals and toasts
    $('#open-modal').onclick = () => openModal({
      title: 'Join the newsletter', id: 'newsletter-modal',
      body: `<p class="muted">We send one practice tip per week.</p><div class="field"><label for="modal-email">Email</label><input id="modal-email" type="email" data-testid="modal-email"><div class="field-error" id="modal-email-error" data-testid="modal-email-error" role="alert"></div></div>`,
      actions: [{ label: 'Not now', kind: 'ghost', id: 'modal-cancel' }, { label: 'Subscribe', id: 'modal-subscribe', onClick: () => { const v = document.getElementById('modal-email').value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { document.getElementById('modal-email-error').textContent = 'Enter a valid email address.'; return false; } set('modal-result', `Subscribed ${v} from the modal.`); toast('Subscribed to the newsletter.', 'success'); } }]
    });
    $('#open-confirm').onclick = () => openModal({
      title: 'Delete this address?', id: 'lab-confirm-modal', body: '<p>You cannot undo this.</p>',
      actions: [{ label: 'Keep it', kind: 'ghost', id: 'lab-confirm-no', onClick: () => { set('modal-result', 'You kept the address.'); } }, { label: 'Delete', kind: 'danger', id: 'lab-confirm-yes', onClick: () => { set('modal-result', 'You deleted the address.'); } }]
    });
    $('#toast-success').onclick = () => toast('Saved successfully.', 'success');
    $('#toast-error').onclick = () => toast('Something failed. Try again.', 'error');
    $('#toast-sticky').onclick = () => toast('This toast stays until you close it.', 'info', 0);

    // locators
    $$('.challenge-rows .buy').forEach(b => b.onclick = () => { const row = b.closest('tr'); document.querySelector('.challenge-out').textContent = `You bought: ${row.cells[0].textContent} for ${row.cells[1].textContent}`; });
  }

  window.ShopLabLab = { render };
})();

</script>
<script>
(function () {
  'use strict';
  const MODE = window.__SHOPLAB_MODE__ === 'server' ? 'server' : 'mock';
  const DB_KEY = 'shoplab_db_v1', TOKEN_KEY = 'shoplab_token', THEME_KEY = 'shoplab_theme';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* blocked */ } }
  };
  const core = MODE === 'mock' ? ShopLabCore.createBackend({
    mode: 'mock',
    load() { const raw = store.get(DB_KEY); return raw ? JSON.parse(raw) : null; },
    save(db) { store.set(DB_KEY, JSON.stringify(db)); }
  }) : null;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + Number(n || 0).toFixed(2);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const stars = r => { const f = Math.round(r); return '★'.repeat(f) + '☆'.repeat(5 - f); };
  const app = $('#app');

  const S = {
    token: store.get(TOKEN_KEY), user: null, session: null, categories: [], cart: null, wishlistIds: new Set(), redirect: null,
    filters: { search: '', categories: [], maxPrice: 200, inStock: false, minRating: 0, sort: 'featured', page: 1, limit: 8 },
    checkout: { step: 1, address: null }
  };

  // ---------------- API client ----------------
  async function request(method, url, opt = {}) {
    const h = {};
    Object.keys(opt.headers || {}).forEach(k => { h[k.toLowerCase()] = opt.headers[k]; });
    if (opt.auth !== false && S.token && !h.authorization) h.authorization = 'Bearer ' + S.token;
    let payload = opt.rawBody != null ? opt.rawBody : (opt.body !== undefined ? JSON.stringify(opt.body) : undefined);
    if (payload !== undefined && !h['content-type']) h['content-type'] = 'application/json';
    const t0 = performance.now();
    let out;
    try {
      if (MODE === 'server') {
        const r = await fetch(url, { method, headers: h, body: method === 'GET' || method === 'HEAD' ? undefined : payload });
        const text = await r.text();
        let data = text;
        if ((r.headers.get('content-type') || '').includes('json')) { try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; } }
        const rh = {}; r.headers.forEach((v, k) => { rh[k] = v; });
        out = { status: r.status, headers: rh, body: data === '' ? null : data };
      } else {
        const u = new URL(url, 'http://localhost:3000');
        const query = {}; u.searchParams.forEach((v, k) => { query[k] = v; });
        let parsed, bodyError = false;
        if (payload !== undefined && payload !== '' && method !== 'GET') {
          try { parsed = JSON.parse(payload); } catch (e) { parsed = payload; bodyError = (h['content-type'] || '').includes('json'); }
        }
        const res = core.handle({ method, path: u.pathname, query, headers: h, body: parsed, bodyError, rawLength: payload && method !== 'GET' ? new Blob([payload]).size : 0 });
        await sleep((res.delay || 0) + 60 + Math.random() * 140);
        out = { status: res.status, headers: res.headers, body: res.body };
      }
    } catch (e) {
      out = { status: 0, headers: {}, body: { error: { code: 'NETWORK_ERROR', message: 'Could not reach the API: ' + e.message } } };
    }
    out.ok = out.status >= 200 && out.status < 300;
    out.time = Math.round(performance.now() - t0);
    if (out.status === 401 && opt.auth !== false && S.token && !opt.silent401 && !/\/auth\/login$/.test(url)) sessionEnded();
    return out;
  }
  const errMsg = r => (r.body && r.body.error && r.body.error.message) || ('Request failed with status ' + r.status + '.');
  window.ShopLabApi = { request, mode: MODE };

  function setToken(t) { S.token = t; store.set(TOKEN_KEY, t); }
  function sessionEnded() {
    setToken(null); S.user = null; S.cart = null; S.wishlistIds = new Set();
    renderUserMenu(); updateBadges();
    toast('Your session ended. Log in again to continue.', 'error');
  }

  // ---------------- UI helpers ----------------
  function toast(msg, type = 'info', ms = 4000) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.setAttribute('data-testid', 'toast-' + type);
    el.innerHTML = `<span class="toast-msg">${esc(msg)}</span><button type="button" aria-label="Dismiss notification">✕</button>`;
    el.querySelector('button').onclick = () => el.remove();
    $('#toasts').appendChild(el);
    if (ms) setTimeout(() => el.remove(), ms);
    return el;
  }
  function openModal({ title, body, actions = [], id = 'modal', onClose }) {
    closeModal();
    const prev = document.activeElement;
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-backdrop" data-testid="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="${esc(id)}" data-testid="${esc(id)}">
      <div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button type="button" class="modal-close" aria-label="Close dialog" data-testid="modal-close">✕</button></div>
      <div class="modal-body">${body}</div>
      ${actions.length ? `<div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}" id="${esc(a.id || 'modal-action-' + i)}">${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div></div>`;
    const close = () => { closeModal(); if (onClose) onClose(); if (prev && prev.focus) prev.focus(); };
    root.querySelector('.modal-close').onclick = close;
    root.querySelector('.modal-backdrop').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-backdrop')) close(); });
    $$('.modal-actions button', root).forEach(b => { b.onclick = () => { const a = actions[+b.dataset.i]; if (a.onClick) { if (a.onClick() !== false) closeModal(); } else close(); }; });
    root._esc = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', root._esc);
    const f = root.querySelector('input, select, textarea, .modal-actions button, .modal-close');
    if (f) f.focus();
    return root.querySelector('.modal');
  }
  function closeModal() {
    const root = $('#modal-root');
    if (root._esc) document.removeEventListener('keydown', root._esc);
    root.innerHTML = '';
  }
  function confirmDialog(title, text, okLabel = 'Confirm') {
    return new Promise(res => {
      openModal({ title, id: 'confirm-modal', body: `<p>${esc(text)}</p>`, onClose: () => res(false), actions: [
        { label: 'Keep it', kind: 'ghost', id: 'confirm-no', onClick: () => res(false) },
        { label: okLabel, kind: 'danger', id: 'confirm-yes', onClick: () => res(true) }
      ] });
    });
  }
  function setBusy(btn, busy, label) {
    if (!btn) return;
    if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(label || 'Working…')}`; }
    else { btn.disabled = false; btn.removeAttribute('aria-busy'); if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }
  function go(route) { if (location.hash.slice(1) === route) router(); else location.hash = route; }
  function catName(id) { const c = (S.categories.length ? S.categories : ShopLabCore.CATEGORIES).find(x => x.id === id); return c ? c.name : id; }
  function thumb(p, cls = '') { return `<div class="thumb ${cls}" style="--h:${+p.hue || 220}" aria-hidden="true"><span>${esc(p.emoji || '📦')}</span></div>`; }

  // form validation: inputs carry data-label and optional pattern/data-msg
  function clearErrors(form) { $$('[aria-invalid]', form).forEach(i => i.removeAttribute('aria-invalid')); $$('.field-error', form).forEach(e => { e.textContent = ''; }); }
  function showError(form, name, msg) {
    const input = form.querySelector(`[name="${name}"]`);
    const box = form.querySelector(`[data-error-for="${name}"]`);
    if (input) input.setAttribute('aria-invalid', 'true');
    if (box) box.textContent = msg;
  }
  function validateForm(form) {
    clearErrors(form);
    let first = null;
    $$('input, select, textarea', form).forEach(i => {
      if (!i.name || i.disabled) return;
      const v = i.type === 'checkbox' ? i.checked : i.value.trim();
      let msg = '';
      if (i.required && !v) msg = i.type === 'checkbox' ? (i.dataset.msg || 'This box must be checked.') : `Enter ${i.dataset.label || 'a value'}.`;
      else if (v && i.pattern && !new RegExp('^(?:' + i.pattern + ')$').test(v)) msg = i.dataset.msg || 'Check the format.';
      else if (v && i.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Enter a valid email address.';
      else if (v && i.minLength > 0 && v.length < i.minLength) msg = `Use at least ${i.minLength} characters.`;
      if (msg) { showError(form, i.name, msg); if (!first) first = i; }
    });
    if (first) first.focus();
    return !first;
  }
  function applyServerErrors(form, r, alertBox) {
    const e = r.body && r.body.error;
    if (alertBox) { alertBox.hidden = false; alertBox.textContent = errMsg(r); }
    if (e && e.details) e.details.forEach(d => showError(form, d.field.split('.').pop(), d.message));
  }
  function field(name, label, opts = {}) {
    const id = opts.id || name;
    const attrs = Object.entries(opts.attrs || {}).map(([k, v]) => v === true ? k : `${k}="${esc(v)}"`).join(' ');
    const control = opts.select
      ? `<select id="${id}" name="${name}" data-testid="${id}" ${attrs}>${opts.select.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(opts.value || '') ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
      : opts.textarea
        ? `<textarea id="${id}" name="${name}" data-testid="${id}" ${attrs}>${esc(opts.value || '')}</textarea>`
        : `<input id="${id}" name="${name}" type="${opts.type || 'text'}" value="${esc(opts.value || '')}" data-testid="${id}" ${attrs}>`;
    return `<div class="field ${opts.cls || ''}"><label for="${id}">${esc(label)}</label>${control}<div class="field-error" id="${id}-error" data-error-for="${name}" role="alert"></div></div>`;
  }

  // ---------------- header, badges, theme ----------------
  function applyTheme() {
    const t = store.get(THEME_KEY);
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  }
  $('#theme-toggle').onclick = () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    store.set(THEME_KEY, dark ? 'light' : 'dark'); applyTheme();
  };
  function renderModeStrip() {
    const el = $('#mode-strip');
    el.className = 'mode-strip ' + MODE;
    el.innerHTML = `<div class="inner" data-testid="mode-strip"><span id="mode-label">${MODE === 'server'
      ? `<strong>Server mode.</strong> The REST API is live at <code>${esc(location.origin)}/api</code>. Point Postman or REST Assured at it.`
      : `<strong>Demo mode.</strong> The API runs inside this browser and saves to this browser only. Run the server kit to call it from Postman or REST Assured.`}</span>
      <button type="button" class="link-btn" id="reset-data" data-testid="reset-data">Reset store data</button></div>`;
    $('#reset-data').onclick = async () => {
      if (!(await confirmDialog('Reset store data?', 'Products, carts, orders and new accounts go back to the original seed. You stay logged in.', 'Reset data'))) return;
      const r = await request('POST', '/api/reset');
      if (r.ok) { toast('Store data is back to the original seed.', 'success'); S.categories = []; await refreshCounts(); router(); } else toast(errMsg(r), 'error');
    };
  }
  function renderUserMenu() {
    const el = $('#user-menu');
    if (!S.user) { el.innerHTML = `<a href="#login" class="menu-trigger" id="nav-login" data-testid="nav-login" data-nav="login">Log in</a>`; return; }
    el.innerHTML = `<button type="button" class="menu-trigger" id="user-menu-button" data-testid="user-menu-button" aria-haspopup="true" aria-expanded="false">Hi, ${esc(S.user.firstName)} ▾</button>
      <div class="dropdown" role="menu" id="user-dropdown" data-testid="user-dropdown">
        <a role="menuitem" href="#account" id="menu-account">My account</a>
        <a role="menuitem" href="#orders" id="menu-orders">My orders</a>
        <a role="menuitem" href="#wishlist" id="menu-wishlist">Wishlist</a>
        ${S.user.role === 'admin' ? '<a role="menuitem" href="#admin" id="menu-admin">Admin panel</a>' : ''}
        <button role="menuitem" type="button" id="logout-button" data-testid="logout-button">Log out</button>
      </div>`;
    const btn = $('#user-menu-button');
    btn.onclick = () => { const open = el.classList.toggle('open'); btn.setAttribute('aria-expanded', String(open)); };
    $$('.dropdown a', el).forEach(a => a.addEventListener('click', () => el.classList.remove('open')));
    $('#logout-button').onclick = logout;
  }
  document.addEventListener('click', e => { const m = $('#user-menu'); if (m && !m.contains(e.target)) m.classList.remove('open'); });
  async function logout() {
    await request('POST', '/api/auth/logout', { silent401: true });
    setToken(null); S.user = null; S.cart = null; S.wishlistIds = new Set();
    renderUserMenu(); updateBadges(); toast('You are logged out.', 'success'); go('login');
  }
  function updateBadges() {
    $('#cart-count').textContent = S.cart ? S.cart.itemCount : 0;
    $('#wishlist-count').textContent = S.wishlistIds.size;
  }
  async function refreshCounts() {
    if (!S.token) { S.cart = null; S.wishlistIds = new Set(); updateBadges(); return; }
    const [c, w] = await Promise.all([request('GET', '/api/cart'), request('GET', '/api/wishlist')]);
    if (c.ok) S.cart = c.body;
    if (w.ok) S.wishlistIds = new Set(w.body.data.map(p => p.id));
    updateBadges();
  }
  function requireLogin(route) {
    if (S.token && S.user) return true;
    S.redirect = route;
    toast('Log in to continue.', 'info');
    go('login');
    return false;
  }

  // header search with suggestions
  (function search() {
    const input = $('#search-input'), list = $('#search-suggestions');
    let timer, items = [], active = -1;
    const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
    const paint = () => {
      list.innerHTML = items.map((p, i) => `<li role="option" id="suggestion-${i}" data-testid="search-suggestion" aria-selected="${i === active}" data-id="${p.id}"><span aria-hidden="true">${esc(p.emoji)}</span><span>${esc(p.name)}</span><span class="s-price">${money(p.price)}</span></li>`).join('');
      if (active >= 0) input.setAttribute('aria-activedescendant', 'suggestion-' + active); else input.removeAttribute('aria-activedescendant');
    };
    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) { close(); return; }
      timer = setTimeout(async () => {
        const r = await request('GET', '/api/products?limit=5&search=' + encodeURIComponent(q), { auth: false });
        items = r.ok ? r.body.data : [];
        active = -1;
        if (!items.length) { list.innerHTML = '<li role="option" aria-disabled="true" id="suggestion-none">No matches</li>'; } else paint();
        list.hidden = false; input.setAttribute('aria-expanded', 'true');
      }, 250);
    });
    input.addEventListener('keydown', e => {
      if (list.hidden || !items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % items.length; paint(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); }
      else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); const id = items[active].id; close(); input.value = ''; go('product-' + id); }
      else if (e.key === 'Escape') close();
    });
    list.addEventListener('mousedown', e => { const li = e.target.closest('li[data-id]'); if (li) { e.preventDefault(); close(); input.value = ''; go('product-' + li.dataset.id); } });
    input.addEventListener('blur', () => setTimeout(close, 150));
    $('#search-form').addEventListener('submit', e => {
      e.preventDefault(); close();
      S.filters.search = input.value.trim(); S.filters.page = 1;
      if ((location.hash.slice(1) || 'shop') === 'shop') loadProducts(); else go('shop');
    });
  })();

  // global actions
  document.addEventListener('click', async e => {
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const id = +a.dataset.id;
    if (a.dataset.action === 'add') { e.preventDefault(); addToCart(id, 1, a); }
    if (a.dataset.action === 'wish') { e.preventDefault(); toggleWish(id, a); }
  });
  async function addToCart(productId, quantity, btn) {
    if (!S.token) { S.redirect = location.hash.slice(1) || 'shop'; toast('Log in to add items to your cart.', 'info'); go('login'); return false; }
    setBusy(btn, true, 'Adding…');
    const r = await request('POST', '/api/cart/items', { body: { productId, quantity } });
    setBusy(btn, false);
    if (r.ok) { S.cart = r.body; updateBadges(); toast('Added to cart.', 'success'); return true; }
    toast(errMsg(r), 'error'); return false;
  }
  async function toggleWish(productId, btn) {
    if (!S.token) { S.redirect = location.hash.slice(1) || 'shop'; toast('Log in to save items to your wishlist.', 'info'); go('login'); return; }
    const on = S.wishlistIds.has(productId);
    const r = on ? await request('DELETE', '/api/wishlist/' + productId) : await request('POST', '/api/wishlist', { body: { productId } });
    if (!r.ok) { toast(errMsg(r), 'error'); return; }
    if (on) S.wishlistIds.delete(productId); else S.wishlistIds.add(productId);
    updateBadges();
    $$(`[data-action="wish"][data-id="${productId}"]`).forEach(b => {
      const now = S.wishlistIds.has(productId);
      b.classList.toggle('on', now); b.setAttribute('aria-pressed', String(now));
      if (b.classList.contains('wish')) { b.textContent = now ? '♥' : '♡'; b.setAttribute('aria-label', (now ? 'Remove from' : 'Add to') + ' wishlist'); }
      else b.textContent = now ? '♥ Saved to wishlist' : '♡ Save to wishlist';
    });
    toast(on ? 'Removed from wishlist.' : 'Saved to wishlist.', 'success');
    if ((location.hash.slice(1)) === 'wishlist') viewWishlist();
  }

  function productCard(p) {
    const inWish = S.wishlistIds.has(p.id);
    const stock = p.stock === 0 ? '<span class="stock out" data-testid="stock-status">Out of stock</span>'
      : p.stock <= 5 ? `<span class="stock low" data-testid="stock-status">Only ${p.stock} left</span>`
        : '<span class="stock in" data-testid="stock-status">In stock</span>';
    return `<article class="product-card" data-testid="product-card" data-product-id="${p.id}" id="product-card-${p.id}">
      <a href="#product-${p.id}" tabindex="-1" aria-hidden="true" style="text-decoration:none">${thumb(p)}</a>
      <button type="button" class="wish ${inWish ? 'on' : ''}" data-action="wish" data-id="${p.id}" aria-pressed="${inWish}" aria-label="${inWish ? 'Remove from' : 'Add to'} wishlist" data-testid="wishlist-toggle">${inWish ? '♥' : '♡'}</button>
      <div class="pc-body">

  // ---------------- router ----------------
  const views = { shop: viewShop, cart: viewCart, checkout: viewCheckout, orders: viewOrders, login: viewLogin, register: viewRegister, account: viewAccount, wishlist: viewWishlist, lab: () => window.ShopLabLab.render(app, { request, toast, openModal, closeModal, esc, MODE }), api: viewApi, admin: viewAdmin };
  async function router() {
    const h = location.hash.slice(1) || 'shop';
    const top = h.split('-')[0];
    $$('[data-nav]').forEach(a => { if (a.dataset.nav === top || (top === 'product' && a.dataset.nav === 'shop')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    closeModal();
    let m;
    window.scrollTo(0, 0);
    if ((m = /^product-(\d+)$/.exec(h))) return viewProduct(+m[1]);
    if ((m = /^order-(\d+)$/.exec(h))) return viewOrder(+m[1]);
    const v = views[h];
    if (!v) return viewNotFound(h);
    const titles = { shop: 'Shop', cart: 'Cart', checkout: 'Checkout', orders: 'My orders', login: 'Log in', register: 'Create account', account: 'My account', wishlist: 'Wishlist', lab: 'Practice lab', api: 'API console', admin: 'Admin panel' };
    document.title = (titles[h] || 'ShopLab') + ' | ShopLab';
    return v();
  }
  window.addEventListener('hashchange', router);

  function viewNotFound(h) {
