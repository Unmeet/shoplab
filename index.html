  let loadSeq = 0;
  async function loadProducts() {
    const f = S.filters, grid = $('#product-grid');
    if (!grid) return;
    const seq = ++loadSeq;
    grid.setAttribute('aria-busy', 'true');
    grid.innerHTML = Array.from({ length: 4 }, () => '<div class="skeleton" data-testid="product-skeleton"></div>').join('');
    const q = new URLSearchParams({ page: f.page, limit: f.limit, sort: f.sort });
    if (f.search) q.set('search', f.search);
    if (f.categories.length) q.set('category', f.categories.join(','));
    if (f.maxPrice < 200) q.set('maxPrice', f.maxPrice);
    if (f.minRating) q.set('minRating', f.minRating);
    if (f.inStock) q.set('inStock', 'true');
    if (f.onSale) q.set('onSale', 'true');
    const r = await request('GET', '/api/products?' + q, { auth: false });
    if (seq !== loadSeq || !$('#product-grid')) return;
    grid.removeAttribute('aria-busy');
    const chips = [];
    if (f.search) chips.push(['search', `Search: ${f.search}`]);
    f.categories.forEach(c => chips.push(['cat:' + c, catName(c)]));
    if (f.maxPrice < 200) chips.push(['price', `Up to ${money(f.maxPrice)}`]);
    if (f.minRating) chips.push(['rating', `${f.minRating}★ and up`]);
    if (f.inStock) chips.push(['stock', 'In stock']);
    if (f.onSale) chips.push(['sale', 'On sale']);
    $('#active-filters').innerHTML = chips.map(c => `<button type="button" class="chip" data-chip="${esc(c[0])}" data-testid="filter-chip" aria-label="Remove filter ${esc(c[1])}">${esc(c[1])}<span aria-hidden="true">✕</span></button>`).join('');
    $$('#active-filters .chip').forEach(b => b.onclick = () => {
      const k = b.dataset.chip;
      if (k === 'search') { f.search = ''; $('#search-input').value = ''; }
      else if (k.startsWith('cat:')) { f.categories = f.categories.filter(c => c !== k.slice(4)); const cb = $('#cat-' + k.slice(4)); if (cb) cb.checked = false; }
      else if (k === 'price') { f.maxPrice = 200; $('#price-max').value = 200; $('#price-max-value').textContent = money(200); }
      else if (k === 'sale') { f.onSale = false; $('#on-sale').checked = false; }
      else if (k === 'rating') { f.minRating = 0; $('#rating-0').checked = true; }
      else if (k === 'stock') { f.inStock = false; $('#in-stock').checked = false; }
      f.page = 1; loadProducts();
    });
    if (!r.ok) { grid.innerHTML = `<div class="alert error" role="alert" style="grid-column:1/-1" data-testid="products-error">${esc(errMsg(r))} <button type="button" class="btn small ghost" id="retry-products" data-testid="retry-products">Try again</button></div>`; $('#retry-products').onclick = loadProducts; return; }
    const { data, meta } = r.body;
    $('#results-title').textContent = f.search ? `Results for “${f.search}”` : 'All products';
    $('#results-count').textContent = meta.total ? `Showing ${(meta.page - 1) * meta.limit + 1}–${(meta.page - 1) * meta.limit + data.length} of ${meta.total} products` : '0 products';
    grid.innerHTML = data.length ? data.map(productCard).join('') : `<div class="empty" data-testid="no-results" style="grid-column:1/-1"><p class="big" aria-hidden="true">🔍</p><h3>No products match these filters</h3><p class="muted">Remove a filter or search for something else.</p><button class="btn ghost" type="button" id="empty-clear">Clear all filters</button></div>`;
    const ec = $('#empty-clear'); if (ec) ec.onclick = () => $('#clear-filters').click();
    const pg = $('#pagination');
    if (meta.totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button type="button" id="page-prev" data-testid="page-prev" ${meta.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹ Prev</button>`;
    for (let i = 1; i <= meta.totalPages; i++) html += `<button type="button" data-page="${i}" id="page-${i}" data-testid="page-${i}" ${i === meta.page ? 'aria-current="page"' : ''}>${i}</button>`;
    html += `<button type="button" id="page-next" data-testid="page-next" ${meta.page === meta.totalPages ? 'disabled' : ''} aria-label="Next page">Next ›</button>`;
    pg.innerHTML = html;
    const to = p => { f.page = p; loadProducts(); $('#results-title').scrollIntoView({ block: 'start' }); };
    $$('[data-page]', pg).forEach(b => b.onclick = () => to(+b.dataset.page));
    $('#page-prev').onclick = () => to(meta.page - 1);
    $('#page-next').onclick = () => to(meta.page + 1);
  }

  async function cancelOrder(id, after) {

  async function loggedIn(body, msg) {
    setToken(body.token); S.user = body.user; S.session = { expiresAt: body.expiresAt };
    renderUserMenu();
    const guest = guestCart();
    if (guest.length) {
      let moved = 0; const failed = [];
      for (const i of guest) { const r = await request('POST', '/api/cart/items', { body: i }); if (r.ok) moved += i.quantity; else failed.push(errMsg(r)); }
      setGuestCart([]);
      if (moved) toast(`Moved ${moved} item${moved === 1 ? '' : 's'} from your guest cart into your account.`, 'success', 6000);
      failed.forEach(m => toast('One item could not be moved: ' + m, 'error', 8000));
    }
    await refreshCounts(); toast(msg, 'success');
    const to = S.redirect || 'shop'; S.redirect = null; go(to);
  }

        <label class="check"><input type="checkbox" name="terms" id="reg-terms" data-testid="reg-terms" required data-msg="Accept the terms to create an account."> I accept the practice store terms</label><div class="field-error" data-error-for="terms" id="reg-terms-error" role="alert"></div>
        <button class="btn" type="submit" id="register-button" data-testid="register-button" style="width:100%;margin-top:.8rem">Create account</button></form>
      <p style="margin-top:1rem">Already registered? <a href="#login" id="go-login">Log in</a></p></div>
      <div class="panel"><h2>What gets checked</h2><p>The form validates in the browser first and the API validates again. Try a taken username like <code>standard_user</code>, a weak password, or mismatched passwords to see each error.</p></div></div>`;
    const pw = $('#reg-password');
    pw.oninput = () => {
      const v = pw.value; let s = 0;
      if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
      const lab = v.length < 8 ? 'too short' : ['weak', 'weak', 'fair', 'good', 'strong'][s];
      $('#pw-strength').textContent = lab;
      const m = $('#pw-meter'); m.style.width = (s * 25) + '%'; m.style.background = s >= 4 ? 'var(--ok)' : s >= 3 ? 'var(--tag)' : 'var(--bad)';
    };
    $('#register-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, box = $('#register-error'); box.hidden = true;
      if (!validateForm(f)) return;
      if ($('#reg-confirm').value !== pw.value) { showError(f, 'confirm', 'Passwords do not match.'); $('#reg-confirm').focus(); return; }
      const d = Object.fromEntries(new FormData(f).entries());
      const btn = $('#register-button'); setBusy(btn, true, 'Creating account…');
      const r = await request('POST', '/api/auth/register', { body: { username: d.username, email: d.email, password: d.password, firstName: d.firstName, lastName: d.lastName }, auth: false });
      setBusy(btn, false);
      if (!r.ok) return applyServerErrors(f, r, box);
      await loggedIn(r.body, `Account created. Welcome, ${r.body.user.firstName}.`);
    };
  }

  function viewApi() {
    const groups = {};
    ShopLabCore.GROUPS.forEach(g => { groups[g] = []; });
    ShopLabCore.ENDPOINTS.forEach((e, i) => { groups[e.group].push([e, i]); });
    const base = MODE === 'server' ? location.origin : MODE === 'remote' ? S.apiBase : MODE === 'sw' ? location.href.split('#')[0].split('?')[0].replace(/\/[^/]*$/, '') : 'http://localhost:3000';
    app.innerHTML = `<div class="page-head"><h1>API console</h1><p>${MODE === 'server' || MODE === 'remote' ? `Requests go over HTTP to <code>${esc(base)}/api</code>, the same URL your API tests use.` : MODE === 'sw' ? `Requests are real HTTP calls to <code>${esc(base)}/api</code>, answered by a service worker in this browser, so they appear in DevTools but not in Postman. Connect a hosted API in Test settings for Postman.` : 'In demo mode requests are answered inside the page, with the same rules and status codes as the server kit. Copy the cURL to run against the kit later.'} Pick an endpoint to load an example request.</p></div>
      <div class="api"><nav class="ep-list" aria-label="Endpoints" data-testid="endpoint-list">${Object.keys(groups).map(g => `<div class="ep-group"><h3>${esc(g)}</h3>${groups[g].map(([e, i]) => `<button type="button" class="ep" data-ep="${i}" data-testid="endpoint"><span class="method m-${e.method}">${e.method}</span><code>${esc(e.path)}</code><small>${esc(e.desc)} ${e.auth !== 'none' ? `<span class="lock">${e.auth === 'admin' ? 'Admin token.' : 'Needs token.'}</span>` : ''}</small></button>`).join('')}</div>`).join('')}</nav>
      <div class="panel" data-testid="api-console">
        <div class="req-line"><div><label for="api-method">Method</label><select id="api-method" data-testid="api-method">${['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map(m => `<option>${m}</option>`).join('')}</select></div>
          <div><label for="api-url">URL</label><input id="api-url" type="text" data-testid="api-url" value="/api/products?limit=3" spellcheck="false"></div>
          <button type="button" class="btn" id="api-send" data-testid="api-send">Send</button></div>
        <label class="check" style="margin-top:.6rem"><input type="checkbox" id="api-use-token" data-testid="api-use-token" checked> Send my login token ${S.token ? '' : '<span class="muted">(you are not logged in)</span>'}</label>
        <div class="form-grid" style="margin-top:.6rem"><div class="field"><label for="api-headers">Extra headers (JSON)</label><textarea id="api-headers" class="code-area" data-testid="api-headers" spellcheck="false">{}</textarea></div>
          <div class="field"><label for="api-body">Body (JSON)</label><textarea id="api-body" class="code-area" data-testid="api-body" spellcheck="false"></textarea></div></div>
        <div class="row-btns"><button type="button" class="btn ghost small" id="api-curl" data-testid="api-curl">Show as cURL</button><button type="button" class="btn ghost small" id="api-format">Format body</button></div>
        <pre class="out" id="api-curl-out" data-testid="api-curl-out" hidden></pre>
        <h2 style="margin-top:1.2rem">Response</h2><div class="resp-meta" id="api-meta" data-testid="api-meta"><span class="muted">Send a request to see the response.</span></div>
        <div class="tablist" role="tablist"><button role="tab" id="resp-tab-body" aria-selected="true">Body</button><button role="tab" id="resp-tab-headers" aria-selected="false">Headers</button></div>
        <pre class="out" id="api-response" data-testid="api-response" aria-live="polite"></pre><pre class="out" id="api-response-headers" data-testid="api-response-headers" hidden></pre>
      </div></div>`;
    $$('[data-ep]').forEach(b => b.onclick = () => {
      const e = ShopLabCore.ENDPOINTS[+b.dataset.ep];
      $('#api-method').value = e.method; $('#api-url').value = e.sample || e.path;
      $('#api-body').value = e.body ? JSON.stringify(e.body, null, 2) : '';
      $('#api-send').focus();
    });
    $('#api-format').onclick = () => { try { $('#api-body').value = JSON.stringify(JSON.parse($('#api-body').value), null, 2); } catch (e) { toast('The body is not valid JSON yet.', 'error'); } };
    const respTabs = [['resp-tab-body', 'api-response'], ['resp-tab-headers', 'api-response-headers']];
    respTabs.forEach(([t]) => $('#' + t).onclick = () => respTabs.forEach(([x, p]) => { const on = x === t; $('#' + x).setAttribute('aria-selected', String(on)); $('#' + p).hidden = !on; }));
    const build = () => {
      let headers = {};
      try { headers = JSON.parse($('#api-headers').value || '{}'); } catch (e) { toast('Extra headers must be valid JSON.', 'error'); return null; }
      return { method: $('#api-method').value, url: $('#api-url').value.trim(), headers, body: $('#api-body').value.trim() };
    };
    $('#api-curl').onclick = () => {
      const q = build(); if (!q) return;
      const url = /^https?:/.test(q.url) ? q.url : base + q.url;
      let c = `curl -i -X ${q.method} '${url}'`;
      if ($('#api-use-token').checked && S.token) c += ` \\\n  -H 'Authorization: Bearer ${S.token}'`;
      Object.keys(q.headers).forEach(k => { c += ` \\\n  -H '${k}: ${q.headers[k]}'`; });
      if (q.body && q.method !== 'GET') c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${q.body.replace(/'/g, "'\\''")}'`;
      const out = $('#api-curl-out'); out.hidden = false; out.textContent = c;
    };
    $('#api-send').onclick = async () => {
      const q = build(); if (!q) return;
      const btn = $('#api-send'); setBusy(btn, true, 'Sending…');
      const h = Object.assign({}, q.headers);
      const r = await request(q.method, q.url, { headers: h, rawBody: q.body && q.method !== 'GET' ? q.body : undefined, auth: $('#api-use-token').checked, silent401: true });
      setBusy(btn, false);
      const size = r.body == null ? 0 : new Blob([typeof r.body === 'string' ? r.body : JSON.stringify(r.body)]).size;
      $('#api-meta').innerHTML = `<span class="code-pill code-${String(r.status)[0]}" id="api-status" data-testid="api-status">${r.status}</span><span>${r.time} ms</span><span>${size} bytes</span>`;
      $('#api-response').textContent = r.body == null ? '(no body)' : typeof r.body === 'string' ? r.body : JSON.stringify(r.body, null, 2);
      $('#api-response-headers').textContent = Object.keys(r.headers).sort().map(k => `${k}: ${r.headers[k]}`).join('\n');
      if (/\/api\/auth\/login$/.test(q.url) && r.ok && r.body.token) toast('Login worked. Use the token in the Authorization header, or log in through the store to send it automatically.', 'info', 6000);
    };
  }

  // ---------------- one-time code and password reset ----------------
  function renderOtpStep(data, username) {
    const tu = ShopLabCore.TEST_USERS.find(u => u.username === username);
    const mailbox = username.includes('@') ? username : (tu ? tu.email : '');
    if (mailbox) store.set('shoplab_inbox_email', mailbox);
    const panel = $('#login-form').closest('.panel');
    panel.innerHTML = `<h1>Enter your sign-in code</h1>
      <p>We emailed a 6-digit code to <strong id="otp-destination" data-testid="otp-destination">${esc(data.deliveredTo)}</strong>. It expires in 5 minutes.</p>
      <p><a href="#inbox" target="_blank" rel="noopener" id="open-inbox-link" data-testid="open-inbox-link">Open the ShopLab inbox in a new tab</a></p>
      <div class="alert error" id="otp-error" data-testid="otp-error" role="alert" hidden></div>
      <form id="otp-form" novalidate data-testid="otp-form">
        <div class="field"><label for="otp-input">6-digit code</label><input id="otp-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" required data-label="the 6-digit code" data-msg="The code is 6 digits." data-testid="otp-input"><div class="field-error" id="otp-input-error" data-error-for="code" role="alert"></div></div>
        <button class="btn" type="submit" id="verify-otp" data-testid="verify-otp" style="width:100%">Verify and log in</button></form>
      <p style="margin-top:1rem"><button type="button" class="link-btn" id="resend-otp" data-testid="resend-otp" disabled>Resend code</button> <span id="resend-status" data-testid="resend-status" role="status" class="muted"></span></p>
      <p><button type="button" class="link-btn" id="otp-back">Use a different account</button></p>`;
    const token = data.mfaToken;
    const cooldown = n => {
      const b = $('#resend-otp'); b.disabled = true; b.textContent = `Resend code in ${n}s`;
      const iv = every(() => { n--; if (!$('#resend-otp')) return clearInterval(iv); if (n <= 0) { clearInterval(iv); b.disabled = false; b.textContent = 'Resend code'; } else b.textContent = `Resend code in ${n}s`; }, 1000);
    };
    cooldown(30);
    $('#otp-back').onclick = () => viewLogin();
    $('#otp-input').oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); };
    $('#otp-input').focus();
    $('#otp-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, box = $('#otp-error'); box.hidden = true;
      if (!validateForm(f)) return;
      const btn = $('#verify-otp'); setBusy(btn, true, 'Verifying…');
      const r = await request('POST', '/api/auth/verify-otp', { body: { mfaToken: token, code: $('#otp-input').value }, auth: false });
      setBusy(btn, false);
      if (!r.ok) {
        applyServerErrors(f, r, box);
        const code = r.body && r.body.error && r.body.error.code;
        if (code === 'TOO_MANY_ATTEMPTS' || code === 'INVALID_MFA_TOKEN') { btn.disabled = true; box.innerHTML = `${esc(errMsg(r))} <button type="button" class="link-btn" id="otp-restart">Log in again</button>`; $('#otp-restart').onclick = () => viewLogin(); }
        return;
      }
      await loggedIn(r.body, `Welcome back, ${r.body.user.firstName}.`);
    };
    $('#resend-otp').onclick = async () => {
      const st = $('#resend-status');
      const r = await request('POST', '/api/auth/resend-otp', { body: { mfaToken: token }, auth: false });

    };
  }

  function pushRecent(id) { const list = readJSON('shoplab_recent', []).filter(x => x !== id); list.unshift(id); writeJSON('shoplab_recent', list.slice(0, 8)); }
  async function renderRecent(currentId) {
    const ids = readJSON('shoplab_recent', []).filter(x => x !== currentId).slice(0, 4);
    const sec = $('#recently-viewed');
    if (!ids.length || !sec) return;
    const r = await request('GET', '/api/products?limit=50', { auth: false });
    if (!r.ok || !$('#recently-viewed')) return;
    const items = ids.map(id => r.body.data.find(p => p.id === id)).filter(Boolean);
    if (!items.length) return;
    sec.innerHTML = `<h2 id="recent-title">Recently viewed</h2><div class="grid">${items.map(productCard).join('')}</div>`;

  document.addEventListener('change', e => {
    const cb = e.target.closest && e.target.closest('[data-compare]');
    if (!cb) return;
    const id = +cb.dataset.compare;
    if (cb.checked) {
      if (S.compare.length >= 3) { cb.checked = false; toast('You can compare up to 3 products. Remove one first.', 'error'); return; }
      if (!S.compare.includes(id)) S.compare.push(id);
    } else S.compare = S.compare.filter(x => x !== id);
    writeJSON('shoplab_compare', S.compare);
    $$(`[data-compare="${id}"]`).forEach(x => { x.checked = S.compare.includes(id); });
    renderCompareTray();
  });
  function renderCompareTray(route) {
    route = route || location.hash.slice(1) || 'shop';
    let tray = $('#compare-tray');
    if (!tray) { tray = document.createElement('div'); tray.id = 'compare-tray'; tray.className = 'compare-tray'; tray.setAttribute('data-testid', 'compare-tray'); tray.setAttribute('role', 'region'); tray.setAttribute('aria-label', 'Product comparison'); document.body.appendChild(tray); }
    if (!S.compare.length || route === 'compare') { tray.hidden = true; return; }
    tray.hidden = false;
    tray.innerHTML = `<span><strong id="compare-count" data-testid="compare-count">${S.compare.length}</strong> of 3 products selected</span><a class="btn small" href="#compare" id="compare-now" data-testid="compare-now">Compare</a><button type="button" class="link-btn" id="compare-clear" data-testid="compare-clear">Clear</button>`;

      const m = r.body;

  function viewScenarios() {
    const list = window.ShopLabScenarios || [];
    const done = new Set(readJSON('shoplab_scenarios_done', []));
    const areas = Array.from(new Set(list.map(x => x.area)));
    const F = { q: '', area: '', type: '', status: '' };
    app.innerHTML = `<div class="page-head"><h1>Test scenarios</h1><p>${list.length} end-to-end scenarios written as test cases. Automate them in any framework and tick them off as you go. Reset store data before each run so the preconditions hold.</p></div>
      <div class="scen-progress"><p><strong id="scenario-progress-text" data-testid="scenario-progress-text"></strong></p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-labelledby="scenario-progress-text" id="scenario-progress"><div class="progress-bar" id="scenario-progress-bar"></div></div></div>
      <div class="table-tools" style="margin-top:1.2rem"><div><label for="scen-search">Search</label><input type="search" id="scen-search" data-testid="scen-search" placeholder="coupon, return, otp…"></div>
        <div><label for="scen-area">Area</label><select id="scen-area" data-testid="scen-area"><option value="">All areas</option>${areas.map(a => `<option>${esc(a)}</option>`).join('')}</select></div>
        <div><label for="scen-type">Type</label><select id="scen-type" data-testid="scen-type"><option value="">All types</option><option>UI</option><option>API</option><option>UI + API</option></select></div>
        <div><label for="scen-status">Progress</label><select id="scen-status" data-testid="scen-status"><option value="">All</option><option value="todo">Not automated</option><option value="done">Automated</option></select></div></div>
      <p class="muted" id="scen-count" data-testid="scen-count"></p><div class="scenario-list" id="scenario-list" data-testid="scenario-list"></div>`;
    const progress = () => {
      const n = list.filter(x => done.has(x.id)).length;
      $('#scenario-progress-text').textContent = `${n} of ${list.length} scenarios automated`;
      $('#scenario-progress-bar').style.width = (list.length ? n / list.length * 100 : 0) + '%';
      $('#scenario-progress').setAttribute('aria-valuenow', n);
    };
    const paint = () => {
      const q = F.q.toLowerCase();

  async function addToGuestCart(productId, quantity, options) {
    const r = await request('GET', '/api/products/' + productId, { auth: false });
    if (!r.ok) return { ok: false, message: errMsg(r) };
    const p = r.body, items = guestCart(), line = items.find(i => i.productId === productId), next = (line ? line.quantity : 0) + quantity;
    if (p.stock === 0) return { ok: false, message: p.name + ' is out of stock.' };
    if (next > 10) return { ok: false, message: 'You can buy at most 10 of one item.' };
    if (next > p.stock) return { ok: false, message: 'Only ' + p.stock + ' of ' + p.name + ' left.' };
    if (line) { line.quantity = next; if (options) line.options = options; } else items.push(Object.assign({ productId, quantity }, options ? { options } : {}));
    setGuestCart(items); updateBadges();
    return { ok: true };
  }
  async function cartAdd(productId, quantity, options) {
    if (!S.token) return addToGuestCart(productId, quantity, options);
    const body = { productId, quantity };
    if (options) body.options = options;
    const r = await request('POST', '/api/cart/items', { body });
    if (r.ok) { S.cart = r.body; updateBadges(); return { ok: true }; }
    return { ok: false, message: errMsg(r) };
  }
  async function addToCart(productId, quantity, btn, options) {

    toast(res.message, 'error');
    return false;
  }

  function bindConsent(root, done) {

  function ssoLogin() {
    const finish = async choice => {
      if (!choice || !choice.approved) { toast('ShopLab ID sign-in was cancelled.', 'info'); return; }
      const r = await request('POST', '/api/auth/oauth', { body: { provider: 'shoplab-id', username: choice.username, consent: true }, auth: false });
      if (!r.ok) { const box = $('#login-error'); if (box) { box.hidden = false; box.textContent = errMsg(r); } else toast(errMsg(r), 'error'); return; }
      await loggedIn(r.body, `Welcome back, ${r.body.user.firstName}.`);
    };
    let w = null;
    try { w = window.open(location.href.split('#')[0] + '#oauth', 'shoplab-id', 'width=460,height=680'); } catch (e) { w = null; }
    if (!w) {
      openModal({ title: 'Sign in with ShopLab ID', id: 'sso-modal', body: consentHtml(), onClose: () => toast('ShopLab ID sign-in was cancelled.', 'info') });
      bindConsent($('#sso-modal'), choice => { closeModal(); finish(choice); });
      return;
    }
    const onMsg = e => { if (e.source !== w || !e.data || e.data.type !== 'shoplab-oauth') return; window.removeEventListener('message', onMsg); finish(e.data); };
    window.addEventListener('message', onMsg);
  }

    $('#delivery-form').onsubmit = async e => {

      const btn = $('#delivery-check'); setBusy(btn, true, 'Checking…');
      const res = await request('GET', `/api/delivery?zip=${encodeURIComponent(zip)}&productId=${p.id}`, { auth: false });

      if (!res.ok) { errEl.textContent = errMsg(res); return; }

      const btn = $('#notify-button'); setBusy(btn, true, 'Saving…');

  async function renderFbt(p, nav, sizeOk, currentOptions) {
    const sec = $('#fbt');

    const r = await request('GET', '/api/products?limit=50', { auth: false });

    const items = [p].concat(picks);
    sec.innerHTML = `<h2 id="fbt-title">Frequently bought together</h2><div class="fbt-row">${items.map((x, i) => `<label class="fbt-item" for="fbt-${x.id}">${thumb(x)}<span><input type="checkbox" id="fbt-${x.id}" data-fbt="${x.id}" data-price="${x.price}" data-testid="fbt-item" checked> ${i === 0 ? '<strong>This item:</strong> ' : ''}${esc(x.name)}<br><strong>${money(x.price)}</strong></span></label>${i < items.length - 1 ? '<span class="plus" aria-hidden="true">+</span>' : ''}`).join('')}

    sec.hidden = false;

    $$('[data-fbt]').forEach(c => { c.onchange = upd; });
    upd();
    $('#fbt-add').onclick = async () => {
      const ids = $$('[data-fbt]:checked').map(c => +c.dataset.fbt);

    };

  async function startServiceWorker() {
    if (!('serviceWorker' in navigator) || !window.isSecureContext || location.protocol === 'file:') return false;
    try { if (window.top !== window.self) return false; } catch (e) { return false; }
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('timeout')), 6000);
          navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); resolve(); }, { once: true });
          const sw = reg.active || reg.waiting || reg.installing;
          if (sw && reg.active) reg.active.postMessage('claim');
        });
      }
      const r = await fetch('./api/health', { cache: 'no-store' });
      const j = await r.json();
      return r.ok && j.mode === 'service-worker';
    } catch (e) { return false; }
  }
  async function connectRemote(base, quiet) {
    if (!quiet) app.innerHTML = `<div class="empty" data-testid="api-connecting"><p class="big" aria-hidden="true">⏳</p><h1>Connecting to the ShopLab API</h1><p class="muted">Calling <code>${esc(base)}/api/health</code>. Free hosting can take up to a minute to wake up after a quiet period.</p></div>`;
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 70000);
      const r = await fetch(base + '/api/health', { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(t);
      const j = await r.json();
      return r.ok && j.status === 'ok';
    } catch (e) { return false; }
  }
  async function chooseMode() {
    if (window.__SHOPLAB_MODE__ === 'server') {
      MODE = 'server';
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
      return;
    }
    const qp = new URLSearchParams(location.search).get('api');
    if (qp === 'off' || qp === 'local') store.set(API_BASE_KEY, null);
    else if (qp) store.set(API_BASE_KEY, normBase(qp));
    const base = store.get(API_BASE_KEY);
    if (base) {
      if (await connectRemote(base)) { MODE = 'remote'; S.apiBase = base; return; }
      S.apiFallback = base;
    }
    if (await startServiceWorker()) { MODE = 'sw'; return; }
    MODE = 'mock';
    core = makeLocalCore();
  }

    ['GET', /^\/api\/orders\/\d+$/, 'Get order'], ['POST', /^\/api\/orders\/\d+\/cancel$/, 'Cancel order'], ['POST', /^\/api\/orders\/\d+\/return$/, 'Request a return'],
    ['POST', /^\/api\/orders\/\d+\/reorder$/, 'Buy again'], ['POST', /^\/api\/orders\/track$/, 'Track order'], ['GET', /^\/api\/wishlist$/, 'Get wishlist'],
    ['POST', /^\/api\/wishlist$/, 'Save to wishlist'], ['DELETE', /^\/api\/wishlist\/\d+$/, 'Remove from wishlist'], ['GET', /^\/api\/addresses$/, 'Get saved addresses'],
    ['GET', /^\/api\/inbox$/, 'Check inbox'], ['GET', /^\/api\/inbox\/\d+$/, 'Read email'], ['POST', /^\/api\/reset$/, 'Reset store data']
  ];
  function apiLabel(method, path) { const r = LABELS.find(([m, re]) => m === method && re.test(path)); return r ? r[2] : ''; }
  function logCall(method, url, full, reqHeaders, payload, out) {
    if (ACT.paused) return;
    const path = String(url).replace(/^https?:\/\/[^/]+/i, '').split('?')[0];
    const shown = Object.assign({}, reqHeaders);
    if (shown.authorization) shown.authorization = shown.authorization.slice(0, 17) + '…';
    let reqBody = null;
    if (payload !== undefined && payload !== '') { try { reqBody = JSON.parse(payload); if (reqBody && typeof reqBody === 'object') { reqBody = Object.assign({}, reqBody); ['password', 'newPassword', 'currentPassword'].forEach(k => { if (reqBody[k]) reqBody[k] = '••••••'; }); if (reqBody.payment && reqBody.payment.cvv) reqBody.payment = Object.assign({}, reqBody.payment, { cvv: '•••' }); } } catch (e) { reqBody = String(payload).slice(0, 2000); } }
    ACT.list.unshift({ id: ++ACT.seq, at: new Date(), method, url: String(url), full: String(full), path, label: apiLabel(method, path), status: out.status, time: out.time, reqHeaders: shown, reqBody, resHeaders: out.headers || {}, resBody: out.body });
    if (ACT.list.length > 150) ACT.list.length = 150;
    const c = $('#aa-count'); if (c) c.textContent = ACT.list.length;
    if (ACT.open) renderActivity();
  }
  function curlFor(c) {
    const base = MODE === 'server' ? location.origin : MODE === 'remote' ? S.apiBase : MODE === 'sw' ? location.href.split('#')[0].split('?')[0].replace(/\/[^/]*$/, '') : 'http://localhost:3000';
    let cmd = `curl -i -X ${c.method} '${/^https?:/i.test(c.url) ? c.url : base + c.url}'`;
    if (c.reqHeaders.authorization) cmd += ` \\\n  -H 'Authorization: Bearer <your token>'`;
    if (c.reqBody !== null) cmd += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(c.reqBody).replace(/'/g, "'\\''")}'`;
    return cmd;
  }
  function renderActivity() {
    let root = $('#api-activity');
    const btn = $('#api-activity-toggle');
    if (btn) btn.setAttribute('aria-expanded', String(ACT.open));
    document.body.classList.toggle('aa-open', ACT.open);
    if (!ACT.open) { if (root) root.hidden = true; return; }
    if (!root) { root = document.createElement('section'); root.id = 'api-activity'; root.className = 'api-activity'; root.setAttribute('data-testid', 'api-activity'); root.setAttribute('aria-label', 'API activity'); document.body.appendChild(root); }
    root.hidden = false;
    const sel = ACT.list.find(x => x.id === ACT.sel) || ACT.list[0];
    const pretty = v => v === null || v === undefined ? '(none)' : typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    const listScroll = $('#aa-list') ? $('#aa-list').scrollTop : 0;
    root.innerHTML = `<div class="aa-head"><strong>API activity</strong><span class="muted small" id="aa-summary">${ACT.list.length} call${ACT.list.length === 1 ? '' : 's'}, newest first. ${MODE === 'mock' ? 'Answered inside the page.' : MODE === 'sw' ? 'Real HTTP requests answered by the service worker.' : 'Real HTTP requests.'}</span>
      <span class="aa-tools"><label class="check small" style="margin:0"><input type="checkbox" id="aa-pause" data-testid="aa-pause" ${ACT.paused ? 'checked' : ''}> Pause</label><button type="button" class="btn small ghost" id="aa-clear" data-testid="aa-clear">Clear</button><button type="button" class="icon-btn" id="aa-close" data-testid="aa-close" aria-label="Close API activity">✕</button></span></div>
      <div class="aa-body"><ol class="aa-list" id="aa-list" data-testid="aa-list">${ACT.list.length ? ACT.list.map(c => `<li><button type="button" class="aa-row ${sel && c.id === sel.id ? 'sel' : ''}" data-call="${c.id}" data-testid="api-call" data-method="${c.method}" data-path="${esc(c.path)}" data-status="${c.status}"><span class="method m-${c.method}">${c.method}</span><span class="aa-path">${esc(c.path)}</span><span class="code-pill code-${String(c.status)[0]}">${c.status || 'ERR'}</span><span class="aa-ms">${c.time} ms</span>${c.label ? `<span class="aa-label">${esc(c.label)}</span>` : ''}</button></li>`).join('') : '<li class="muted small" style="padding:.8rem">No calls yet. Log in, open a product or check out to see the API at work.</li>'}</ol>
      <div class="aa-detail" id="aa-detail" data-testid="aa-detail">${sel ? `<p><strong>${esc(sel.label || 'Request')}</strong> <span class="muted small">${sel.at.toLocaleTimeString()}</span></p><p class="small"><code>${sel.method} ${esc(sel.full)}</code></p>
        <h3>Request headers</h3><pre class="out">${esc(pretty(sel.reqHeaders))}</pre><h3>Request body</h3><pre class="out">${esc(pretty(sel.reqBody))}</pre>
        <h3>Response ${sel.status}</h3><pre class="out">${esc(Object.keys(sel.resHeaders).sort().map(k => k + ': ' + sel.resHeaders[k]).join('\n') || '(none)')}</pre><pre class="out" id="aa-response-body" data-testid="aa-response-body">${esc(pretty(sel.resBody).slice(0, 6000))}</pre>
        <h3>As cURL</h3><pre class="out" id="aa-curl">${esc(curlFor(sel))}</pre>` : ''}</div></div>`;
    const l = $('#aa-list'); if (l) l.scrollTop = listScroll;
    $$('.aa-row', root).forEach(b => { b.onclick = () => { ACT.sel = +b.dataset.call; renderActivity(); }; });
    $('#aa-pause').onchange = e => { ACT.paused = e.target.checked; };
    $('#aa-clear').onclick = () => { ACT.list = []; ACT.sel = null; const c = $('#aa-count'); if (c) c.textContent = 0; renderActivity(); };
    $('#aa-close').onclick = () => { ACT.open = false; store.set('shoplab_api_panel', null); renderActivity(); };
  }

  // ---------------- boot ----------------
  async function init() {
    applyTheme();
    if ((location.hash.slice(1)) === 'oauth') document.body.classList.add('popup-mode');
    await chooseMode();
    renderModeStrip(); renderActivity();
    renderAnnouncement(); renderCategoryBar();
    if (S.token) {
      const r = await request('GET', '/api/auth/me', { silent401: true });
      if (r.ok) { S.user = r.body.user; S.session = r.body.session; } else setToken(null);
    }
    renderUserMenu(); await refreshCounts(); router();
    showCookieBanner();
    if (S.apiFallback) toast(`Could not reach the API at ${S.apiFallback}. Using the built-in API instead. Check the address in Test settings.`, 'error', 9000);
  }
  init();
})();

</script>
</body>
